<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>電験 理論</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="電験 理論">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#f3f2ee">
<style>
:root{--bg:#f3f2ee;--panel:#fff;--ink:#1b1b1b;--sub:#6b6b6b;--line:#dcdad3;--accent:#2457c5;--ok:#1f8a4c;--okbg:rgba(31,138,76,.14);--ng:#c0392b;--ngbg:rgba(192,57,43,.14);--selbg:rgba(36,87,197,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}   /* 長押しでiPadのメニューが出ないように */
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%}
/* 上の帯：問題の情報・判定・次へ */
#top{height:50px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px;background:#fff;border-bottom:1px solid var(--line)}
#top .t{font-weight:bold;font-size:15px}
#top .m{color:var(--sub);font-size:13px;white-space:nowrap}
#timer{font-variant-numeric:tabular-nums}
#judge{font-weight:bold;font-size:15px;padding:6px 12px;border-radius:8px;display:none;white-space:nowrap}
#judge.ok{display:inline-block;background:var(--okbg);color:var(--ok)}
#judge.ng{display:inline-block;background:var(--ngbg);color:var(--ng)}
#fallback{display:none;gap:6px}
#fallback.on{display:flex}
.fb{width:40px;height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:18px;cursor:pointer}
.fb.sel{border-color:var(--accent);background:var(--selbg)}
.fb.right{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.fb.wrong{border-color:var(--ng);background:var(--ngbg);color:var(--ng)}
.sp{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff}
#expToggle{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer}
#expToggle[hidden],#retry[hidden]{display:none}
#retry{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer}
#next{height:36px;padding:0 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:bold;cursor:pointer}
#next[disabled]{opacity:.35;cursor:default}
/* 道具 */
#tools{flex:none;display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--line);background:#fafaf8}
.tb{width:38px;height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;display:grid;place-items:center;cursor:pointer;font-size:12px}
.tb.wide{width:auto;padding:0 10px}
.tb.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:#eef3fd}
.tb svg{width:20px;height:20px}
.dot{width:16px;height:16px;border-radius:50%}
.sepv{width:1px;height:24px;background:var(--line);margin:0 4px}
.sl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);white-space:nowrap}
.sl input[type=range]{width:88px;accent-color:var(--accent)}
.sl .pv{width:28px;height:28px;display:grid;place-items:center}
.sl .pv i{display:block;border-radius:50%;background:var(--ink)}
.sl .pv i.ring{background:transparent;border:1.5px solid var(--ink)}
#eraserRing{position:fixed;left:0;top:0;border:1.5px solid rgba(0,0,0,.65);box-shadow:0 0 0 1px rgba(255,255,255,.9);border-radius:50%;pointer-events:none;display:none;z-index:30;transform:translate(-50%,-50%)}
#laser{position:fixed;left:0;top:0;pointer-events:none;display:none;z-index:12}
#slots{display:flex;gap:4px}
.slot{width:38px;height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;display:grid;place-items:center;cursor:pointer}
.slot.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:#eef3fd}
.slot i{display:block;border-radius:50%}
.slot i.ring{border:1.5px solid var(--ink);background:transparent}
#pop{position:fixed;display:none;z-index:35;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:12px 14px;width:280px}
#pop.on{display:block}
#pop .ph{font-size:13px;font-weight:bold;margin-bottom:8px}
#pop .prow{display:flex;align-items:center;gap:10px;margin:6px 0}
#pop input[type=range]{flex:1;accent-color:var(--accent)}
#popVal{min-width:40px;text-align:right;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
#pop .pnote{font-size:11px;color:var(--sub);line-height:1.5;margin-top:6px}
#toast{position:fixed;left:50%;top:110px;transform:translateX(-50%);background:rgba(27,27,27,.85);color:#fff;font-size:14px;padding:8px 16px;border-radius:20px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:40}
#toast.on{opacity:1}
#zoomv{font-size:12px;color:var(--sub);min-width:48px;height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;font-variant-numeric:tabular-nums;cursor:pointer}
/* 本体：左＝問題（拡大・書き込み）、右＝解説（横に出す時だけ） */
#main{flex:1;display:flex;min-height:0}
#scroller{flex:1;min-width:0;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--panel);position:relative}
#sheet{position:relative}
#sheet img{position:absolute;left:0;top:0;display:block}
.hd{position:absolute;left:0;font-size:13px;font-weight:bold;color:var(--sub);padding:2px 8px;background:#f1f0ec;border-radius:6px}
.cb{position:absolute;border:2px solid transparent;border-radius:6px;pointer-events:none}
.cb.sel{border-color:var(--accent);background:var(--selbg)}
.cb.right{border-color:var(--ok);background:var(--okbg)}
.cb.wrong{border-color:var(--ng);background:var(--ngbg)}
#ink{position:absolute;left:0;top:0;touch-action:pan-x pan-y}
#side{flex:none;width:0;overflow:auto;-webkit-overflow-scrolling:touch;background:#fff;border-left:1px solid var(--line)}
#side.on{width:var(--sidew)}
#side .in{padding:10px;transform-origin:0 0}
#sidebar{position:sticky;top:0;left:0;width:calc(var(--sidew) - 1px);box-sizing:border-box;z-index:2;display:flex;align-items:center;gap:6px;justify-content:flex-end;padding:6px 10px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line)}
#sidebar .lbl{font-size:12px;color:var(--sub);margin-right:auto}
#sidebar button{height:30px;min-width:34px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px;cursor:pointer}
#side h3{font-size:13px;color:var(--sub);margin:6px 0;background:#f1f0ec;display:inline-block;padding:2px 8px;border-radius:6px}
#side img{display:block;margin:0 0 14px}
#side .errata{box-sizing:border-box;border:1px solid #c98a14;background:#fdf6e6;color:#7a4f00;font-size:12px;line-height:1.5;padding:4px 8px;border-radius:6px;margin:0 0 6px}
/* ホーム・取り込み */
#home,#imp{position:fixed;inset:0;background:var(--bg);z-index:15;overflow:auto;-webkit-overflow-scrolling:touch}
#home[hidden],#imp[hidden]{display:none}
.wrap{max-width:1000px;margin:0 auto;padding:20px 24px 60px}
.hh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.hh h1{font-size:22px;margin:0}
.hh .sp{flex:1}
.lnk{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer;white-space:nowrap}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lab{font-size:13px;color:var(--sub)}
.chip{height:38px;min-width:52px;padding:0 12px;border-radius:19px;border:1px solid var(--line);background:#fff;font-size:15px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stat{font-size:13px;color:var(--sub)}
.stat b{color:var(--ink);font-size:15px}
.chap{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;margin-bottom:8px}
.chap .nm{font-size:16px;font-weight:bold}
.chap .sub{font-size:12px;color:var(--sub);margin-top:4px}
.bar{height:6px;border-radius:3px;background:#eceae4;overflow:hidden;margin-top:8px;display:flex}
.bar i{display:block;height:100%}
.bar i.ok{background:var(--ok)}
.bar i.ng{background:var(--ng)}
.go{height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:bold;font-size:14px;cursor:pointer;white-space:nowrap}
.go.ghost{background:#fff;color:var(--accent)}
.go[disabled]{opacity:.35;cursor:default}
.note2{font-size:12px;color:var(--sub);line-height:1.7}
.unit{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;margin-bottom:6px}
.unit .no{font-size:20px;font-weight:bold;color:var(--sub);text-align:center}
.unit .nm{font-size:16px;font-weight:bold}
.unit .sub{font-size:12px;color:var(--sub);margin-top:3px}
.unit .sub b{color:var(--ink)}
.unit .acts{display:flex;gap:6px}
.vid{height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.vid svg{width:18px;height:18px}
.secth{font-size:13px;color:var(--sub);margin:16px 4px 6px}
.unit .sub.split{margin-top:2px}
.tag2{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:#fff3cd;color:#7a5b00;white-space:nowrap}
#unitTag{display:none}
#unitTag svg{width:14px;height:14px;vertical-align:-2px;margin-right:2px}
/* 正解・間違いのアイコン（丸・バツ） */
.ic{display:inline-block;width:1em;height:1em;vertical-align:-.12em}
.ic.ok{color:var(--ok)}
.ic.ng{color:var(--ng)}
.unit .sub .ic{width:13px;height:13px;vertical-align:-2px;margin:0 2px 0 6px}
#judge .ic,#dJudge .ic{width:18px;height:18px;vertical-align:-4px}
#judge .ic + .ic{margin-left:8px}
#doneText .ic{width:22px;height:22px;vertical-align:-4px;margin:0 4px 0 12px}
/* ホーム下のタブ */
#home .wrap{padding-bottom:96px}
#foot{position:fixed;left:0;right:0;bottom:0;z-index:16;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#foot button{flex:1;height:58px;border:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--sub);cursor:pointer;position:relative}
#foot button svg{width:24px;height:24px}
#foot button.on{color:var(--accent);font-weight:bold}
#foot button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
/* ドリル */
#drill{position:fixed;inset:0;background:var(--bg);z-index:18;display:flex;flex-direction:column}
#drill[hidden]{display:none}
#dtop{height:50px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px;background:#fff;border-bottom:1px solid var(--line)}
#dbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.dwrap{max-width:860px;margin:0 auto;padding:28px 24px 60px}
#dq{font-size:22px;line-height:1.8;margin-bottom:18px}
#dq .katex{font-size:1.1em}
.dch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dbtn{min-height:64px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:20px;cursor:pointer;text-align:left}
.dbtn.right{border-color:var(--ok);background:var(--okbg)}
.dbtn.wrong{border-color:var(--ng);background:var(--ngbg)}
.dbtn[disabled]{cursor:default}
#dexp{margin-top:16px;font-size:16px;line-height:1.8;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
#dexp[hidden]{display:none}
#dpad{display:block;width:100%;height:300px;background:#fff;border:1px solid var(--line);border-radius:12px;touch-action:none}
#dfig{display:block;max-width:100%;margin:0 0 14px;border:1px solid var(--line);border-radius:8px;background:#fff}
#dfig[hidden]{display:none}
.drow{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
#impLog{font-size:13px;color:var(--sub);white-space:pre-wrap;margin-top:10px}
/* 終わり */
#done{position:fixed;inset:0;background:var(--bg);display:none;z-index:20;align-items:center;justify-content:center;flex-direction:column;gap:16px;font-size:18px}
#done.on{display:flex}
.big{height:52px;width:320px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:17px;cursor:pointer}
.big.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:bold}
</style></head><body>
<div id="app">
  <div id="top">
    <button class="lnk" id="toHome">ホーム</button>
    <span class="t" id="chapName"></span>
    <span class="tag2" id="unitTag"></span>
    <span class="m" id="pos"></span>
    <span class="m" id="src"></span>
    <span class="m" id="timer">0:00</span>
    <span id="fallback"></span>
    <span id="judge"></span>
    <span class="sp"></span>
    <button id="retry" hidden>もう一度解く</button>
    <button id="expToggle" hidden>解説を閉じる</button>
    <button id="next" disabled>次の問題へ</button>
  </div>
  <div id="tools">
    <button class="tb on" data-tool="pen" title="ペン"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/></svg></button>
    <button class="tb" data-tool="erase" title="消しゴム"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20h12"/><path d="M4.5 15.5l9-9a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L12 18H7l-2.5-2.5z"/><path d="M9 11l5 5"/></svg></button>
    <button class="tb" data-tool="laser" title="レーザーポインター"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l9-9"/><circle cx="15.5" cy="8.5" r="2.5" fill="currentColor" stroke="none"/><path d="M15.5 2.5v1.5"/><path d="M21.5 8.5H20"/><path d="M19.7 4.3l-1.1 1.1"/><path d="M19.7 12.7l-1.1-1.1"/><path d="M11.3 4.3l1.1 1.1"/></svg></button>
    <div id="slots"></div>
    <span class="sepv"></span>
    <button class="tb on" data-color="#1b1b1b" title="黒"><span class="dot" style="background:#1b1b1b"></span></button>
    <button class="tb" data-color="#d0342c" title="赤"><span class="dot" style="background:#d0342c"></span></button>
    <button class="tb" data-color="#2457c5" title="青"><span class="dot" style="background:#2457c5"></span></button>
    <span class="sepv"></span>
    <button class="tb" id="undo" title="取り消し"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="tb" id="redo" title="やり直し"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button class="tb" id="clear" title="全消去"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg></button>
    <span class="sp"></span>
    <button class="tb wide" id="zoomOut" title="縮小">－</button>
    <button id="zoomv" title="押すと100%に戻る">100%</button>
    <button class="tb wide" id="zoomIn" title="拡大">＋</button>
    <span class="sepv"></span>
    <button class="tb" id="finger" title="指でも書く"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5a1.5 1.5 0 0 1 3 0v5"/><path d="M12 10V8.5a1.5 1.5 0 0 1 3 0V11"/><path d="M15 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L4 15.5a1.5 1.5 0 0 1 2.5-1.6L9 16"/></svg></button>
  </div>
  <div id="main">
    <div id="scroller"><div id="sheet"><canvas id="ink"></canvas></div></div>
    <div id="side"><div id="sidebar"><span class="lbl">解説</span><button id="eOut">－</button><button id="eZv" title="押すと100%に戻る">100%</button><button id="eIn">＋</button></div><div class="in" id="sidein"></div></div>
  </div>
</div>
<div id="home" hidden><div class="wrap">
  <div class="hh"><h1>電験三種 理論</h1><span class="sp"></span><button class="lnk" id="toImp">問題データ</button><button class="lnk" id="exportBtn">記録を書き出す</button><button class="lnk" id="importRec">記録を読み込む</button><input type="file" id="recFile" accept=".json,application/json" hidden></div>
  <div class="card">
    <div class="row"><span class="lab">難易度</span><span id="starChips" class="row"></span><span class="sp"></span><span class="lab">出す問題</span>
      <div class="seg" id="modeSeg"><button data-m="todo" class="on">まだ正解していない</button><button data-m="all">すべて</button></div></div>
    <div class="row" style="margin-top:10px"><span class="stat" id="totalStat"></span><span class="sp"></span>
      <button class="go ghost" id="goWrong">間違えた問題（<span id="wrongN">0</span>）</button></div>
  </div>
  <div id="chapList"></div>
  <div class="card" id="ghCard">
    <div class="row"><span class="lab">記録のバックアップ（GitHub）</span><span class="sp"></span><span class="note2" id="ghState"></span><button class="lnk" id="ghNow">今すぐ上げる</button><button class="lnk" id="ghEdit">設定</button></div>
    <div id="ghForm" hidden style="margin-top:10px">
      <div class="row"><span class="lab" style="width:90px">リポジトリ</span><input id="ghRepo" style="flex:1;height:36px;font-size:15px;padding:0 8px;border:1px solid var(--line);border-radius:8px" value="yamanezumi42/denken-records"></div>
      <div class="row" style="margin-top:8px"><span class="lab" style="width:90px">トークン</span><input id="ghToken" type="password" autocomplete="off" placeholder="github_pat_…" style="flex:1;height:36px;font-size:15px;padding:0 8px;border:1px solid var(--line);border-radius:8px"></div>
      <div class="row" style="margin-top:8px"><button class="go" id="ghSave">保存して上げる</button><button class="lnk" id="ghClear">トークンを消す</button></div>
    </div>
  </div>
</div>
<nav id="foot"><button data-tab="video"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>動画</button><button data-tab="unit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10 5 7 4.5 4 5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5z"/><path d="M12 6.5v13"/></svg>単元学習</button></nav>
</div>
<div id="imp" hidden><div class="wrap">
  <div class="hh"><h1>問題データ</h1><span class="sp"></span><button class="lnk" id="impBack">ホームへ</button></div>
  <div class="card"><div class="note2" id="impHave"></div></div>

async function build(){

const snapshot = () => { history.push(copyStrokes()); future = []; };   // 新しく書いたら、やり直しの分は捨てる

// 消しゴム：部分消し＝なぞった所だけ切り取る／線ごと＝触れた線を丸ごと消す

    const a = s.pts[i-1], b = s.pts[i], n = Math.floor(Math.hypot(b.x - a.x, b.y - a.y) / step);

/* レーザーポインター：光る点と線。ペンを離して約1秒たつとフェードして消える。strokes・取り消しの履歴には入れない。

  const r = scroller.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  Object.assign(laser.style, {display: "block", left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px"});
  const w = Math.round(r.width * d), h = Math.round(r.height * d);

let down = null;   // 押した位置と時刻（動かさずに離したら「選ぶ」）
ink.addEventListener("pointerdown", e => {
  if (pinch) return;
  down = {x: e.clientX, y: e.clientY, t: Date.now(), type: e.pointerType};
  if (!canDraw(e)) return;
  e.preventDefault(); try { ink.setPointerCapture(e.pointerId); } catch(err) {}
  const p = pt(e);
  if (tool === "laser"){ cur = {laser: true, pts: laserStart(p)}; return; }   // 履歴に入れない
  snapshot();
  if (tool === "erase"){ cur = {erase: true}; showRing(e); eraseAt(p); return; }
  cur = {color, w: width, pts: [p]}; strokes.push(cur); drawStroke(cur);
});
ink.addEventListener("pointermove", e => {
  if (canDraw(e) && !pinch) showRing(e);           // 消しゴムの時は、ペンの位置に円を出す（PCはマウスを乗せただけでも）
  if (!cur || pinch) return;
  let evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  if (!evs.length) evs = [e];   // 合成したイベントでは空になる
  for (const ev of evs){
    const p = pt(ev);
    if (cur.erase){ eraseAt(p); continue; }
    if (cur.laser){ cur.pts.push(p); continue; }
    const a = cur.pts[cur.pts.length - 1]; cur.pts.push(p);

  cur = null;
  if (!down || pinch) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), quick = Date.now() - down.t < 400;
  if (moved < 6 && quick && (down.type === "touch" || down.type === "mouse")){

    const p = pt(e);
    const hit = blocks.find(b => b.kind === "cb" && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h);
    if (hit && !answered){

/* ---------- 指2本で拡大・縮小（書いた線と選択肢の枠も一緒に） ----------
   指を動かしている間は #sheet を transform で見た目だけ拡大し（軽い）、離した時に倍率を確定して作り直す。
   指2本の真ん中にある面上の点が、ずっと指の真ん中に留まるようにする。 */
let pinch = null;
const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
function mid(e){ const r = scroller.getBoundingClientRect(), [a, b] = e.touches; return {x: (a.clientX + b.clientX) / 2 - r.left, y: (a.clientY + b.clientY) / 2 - r.top}; }
ink.addEventListener("touchstart", e => {
  const stylus = [...e.touches].some(t => t.touchType === "stylus");
  if (stylus || (fingerDraw && e.touches.length === 1)) e.preventDefault();          // ペンで触れた時はスクロールしない
  if (e.touches.length === 2 && !stylus && !tri){
    e.preventDefault();
    if (cur && !cur.erase && !cur.laser){ strokes.pop(); history.pop(); } laserEnd(); cur = null; down = null; redraw();
    const m = mid(e);
    pinch = {d0: dist(...e.touches), z0: Z, sl: scroller.scrollLeft, st: scroller.scrollTop,
             cx: (scroller.scrollLeft + m.x) / Z, cy: (scroller.scrollTop + m.y) / Z, m, m0: m, s: 1, t0: Date.now()};
    sheet.style.transformOrigin = "0 0"; sheet.style.willChange = "transform";
  }
}, {passive: false});
ink.addEventListener("touchmove", e => {
  const stylus = [...e.touches].some(t => t.touchType === "stylus");
  if (stylus || (fingerDraw && e.touches.length === 1)) e.preventDefault();
  if (pinch && e.touches.length === 2){
    e.preventDefault();
    const m = mid(e), z = clampZ(pinch.z0 * dist(...e.touches) / pinch.d0), s = z / pinch.z0;
    // 面上の点 (cx,cy)（今の倍率で cx*z0）が、画面の m に来るように平行移動
    const tx = m.x + pinch.sl - s * pinch.cx * pinch.z0, ty = m.y + pinch.st - s * pinch.cy * pinch.z0;
    sheet.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;   // 見た目の位置＝tx + s*P - scroll
    pinch.m = m; pinch.s = s;
  }
}, {passive: false});
function endPinch(){
  if (!pinch) return;
  const p = pinch; pinch = null;
  sheet.style.transform = ""; sheet.style.willChange = "";
  // 2本指のタップで取り消す機能は外した（2026-10-29 本人「2本指でタップしたときに取り消しにするのなしにして」）
  setZoom(p.z0 * p.s, p.cx, p.cy, p.m.x, p.m.y);
}
// 3本指で左にスライド＝取り消し、右にスライド＝やり直し（GoodNotes と同じ）。
// ※iPadOS が3本指の操作を先に受け取る場合は、ページまで届かない（実機で確認）
let tri = null;
const avg = e => { const ts = [...e.touches]; return {x: ts.reduce((a, t) => a + t.clientX, 0) / ts.length, y: ts.reduce((a, t) => a + t.clientY, 0) / ts.length}; };
ink.addEventListener("touchstart", e => {
  if (e.touches.length !== 3) return;
  e.preventDefault();
  if (pinch){ pinch = null; sheet.style.transform = ""; sheet.style.willChange = ""; }   // 2本指の拡大は取りやめ
  if (cur && !cur.erase && !cur.laser){ strokes.pop(); history.pop(); redraw(); } laserEnd(); cur = null; down = null;
  const a = avg(e); tri = {x0: a.x, y0: a.y, x: a.x, y: a.y};
}, {passive: false});
ink.addEventListener("touchmove", e => { if (tri && e.touches.length === 3){ e.preventDefault(); const a = avg(e); tri.x = a.x; tri.y = a.y; } }, {passive: false});
ink.addEventListener("touchend", e => {
  if (!tri || e.touches.length) return;

ink.addEventListener("touchend", e => { if (e.touches.length < 2 && !tri) endPinch(); });

const clampZ = z => Math.max(Math.min(ZFIT, ZMIN), Math.min(ZFIT * 3, z));   // 100%より小さくはしない（本人 2026-10-22）。例外は問題全体を入れる時だけ
function setZoom(z, cx, cy, mx, my){
  // 面上の点(cx,cy)が画面上の(mx,my)に留まるように拡大する
  Z = clampZ(z);
  place();
  scroller.scrollLeft = cx * Z - mx; scroller.scrollTop = cy * Z - my;
}
function zoomBy(f){ const mx = scroller.clientWidth / 2, my = scroller.clientHeight / 2; setZoom(Z * f, (scroller.scrollLeft + mx) / Z, (scroller.scrollTop + my) / Z, mx, my); }
$("#zoomIn").onclick = () => zoomBy(1.25);
$("#zoomOut").onclick = () => zoomBy(0.8);

// PC：Ctrl＋ホイールで拡大
scroller.addEventListener("wheel", e => { if (!e.ctrlKey) return; e.preventDefault(); const r = scroller.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top; setZoom(Z * (e.deltaY < 0 ? 1.1 : 0.9), (scroller.scrollLeft + mx) / Z, (scroller.scrollTop + my) / Z, mx, my); }, {passive: false});

/* ---------- 解説の欄だけの拡大・縮小（問題とは別。100%〜300%） ---------- */
const side = $("#side"), sidein = $("#sidein");
let EZ = 1, spinch = null;
function placeSide(){
  sidein.querySelectorAll("img").forEach(im => im.style.width = im.dataset.nw * BASE * ZFIT * EZ + "px");
  sidein.querySelectorAll("h3").forEach(h => h.style.fontSize = 13 * EZ + "px");

  sidein.querySelectorAll(".errata").forEach(e => { e.style.fontSize = 12 * EZ + "px"; const im = e.nextElementSibling; if (im && im.style.width) e.style.maxWidth = im.style.width; });

const clampE = z => Math.max(1, Math.min(3, z));
// 欄の中の座標：上の操作の帯（拡大しない）の下にある sidein の左上が原点。OFF＝その帯の高さ
const OFF = () => sidein.offsetTop;

function setEZ(z, c, mx, my){

function eZoomBy(f){ const mx = side.clientWidth / 2, my = side.clientHeight / 2; setEZ(EZ * f, toC(mx, my), mx, my); }
$("#eIn").onclick = () => eZoomBy(1.25);
$("#eOut").onclick = () => eZoomBy(0.8);
$("#eZv").onclick = () => eZoomBy(1 / EZ);
function smid(e){ const r = side.getBoundingClientRect(), [a, b] = e.touches; return {x: (a.clientX + b.clientX) / 2 - r.left, y: (a.clientY + b.clientY) / 2 - r.top}; }
side.addEventListener("touchstart", e => {

side.addEventListener("touchmove", e => {

  sidein.style.transform = `translate(${m.x + spinch.sl - s * spinch.c.x * spinch.z0}px, ${m.y + spinch.st - OFF() - s * spinch.c.y * spinch.z0}px) scale(${s})`;

function endSidePinch(){
  if (!spinch) return;

side.addEventListener("wheel", e => { if (!e.ctrlKey) return; e.preventDefault(); const r = side.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top; setEZ(EZ * (e.deltaY < 0 ? 1.1 : 0.9), toC(mx, my), mx, my); }, {passive: false});

/* ---------- 道具 ---------- */
const setOn = (sel, el) => document.querySelectorAll(sel).forEach(x => x.classList.toggle("on", x === el));
/* ペン・消しゴム：それぞれ3つの太さ（大きさ）を保存しておき、帯の3つのボタンで切り替える。
   ペン・消しゴムのボタンを長押し（または選んでいる時にもう一度押す）と、今の枠の太さを変えるメニューが出る。変えた値はその枠に保存される */
const TOOLKEY = "denken_proto_tools";
let slots = {pen: [1.2, 2.0, 3.6], erase: [6, 12, 24]}, slotIdx = {pen: 1, erase: 1};
try { const t = JSON.parse(localStorage.getItem(TOOLKEY) || "null"); if (t){ slots = t.slots; slotIdx = t.slotIdx; emode = t.emode || emode; } } catch(e) {}
const saveTools = () => { try { localStorage.setItem(TOOLKEY, JSON.stringify({slots, slotIdx, emode})); } catch(e) {} };
function applySlot(){ width = slots.pen[slotIdx.pen]; eraseR = slots.erase[slotIdx.erase]; }
function setTool(t){ tool = t; setOn("#tools [data-tool]", document.querySelector(`[data-tool="${t}"]`)); paintSlots(); }
function paintSlots(){
  const box = $("#slots"), t = tool;
  if (t === "laser"){ box.innerHTML = ""; return; }   // レーザーは太さ固定
  box.innerHTML = slots[t].map((v, i) => {
    const d = t === "pen" ? Math.max(2, Math.min(18, v * 2)) : Math.max(6, Math.min(28, v * 1.1));
    const dot = t === "pen" ? `<i style="width:${d}px;height:${d}px;background:${color}"></i>` : `<i class="ring" style="width:${d}px;height:${d}px"></i>`;
    return `<button class="slot${i === slotIdx[t] ? " on" : ""}" data-i="${i}" title="${t === "pen" ? "太さ" : "消す範囲"} ${i + 1}">${dot}</button>`;
  }).join("");
}
$("#slots").addEventListener("click", e => {
  const b = e.target.closest(".slot"); if (!b) return;
  const i = +b.dataset.i;
  if (i === slotIdx[tool]) return openPop(tool);     // 選んでいる枠をもう一度押したら、太さを変えるメニュー
  slotIdx[tool] = i; applySlot(); saveTools(); paintSlots();
});

// ドリルを作り直した（2026-10-29 03:57 配信）。それより前のドリルの記録は番号がずれるので消す（本人「ドリルの記録消していいよ」）。
// 消した印（del）も残すので、GitHub の記録と混ぜても生き返らない。過去問の記録は触らない。
const DRILL_V2 = Date.parse("2026-10-29T03:57:00+09:00");
const oldDrill = x => String(x.id).startsWith("d:") && x.t < DRILL_V2;
function dropOldDrill(){
  const old = REC.log.filter(oldDrill); if (!old.length) return false;
  REC.del = [...new Set([...(REC.del || []), ...old.map(x => x.id + "|" + x.t)])];
  REC.log = REC.log.filter(x => !oldDrill(x)); return true;
}
const saveRec = () => { try { localStorage.setItem(RECKEY, JSON.stringify(REC)); } catch(e) { toast("記録を保存できませんでした"); } };
if (dropOldDrill()) saveRec();   // 起動時に1回（GitHub へは次の同期で上がる）
function addRec(r){ REC.log.push(r); saveRec(); syncSoon(); }
// 「もう一度解く」で消した記録は、消した印（del）を残す。印がないと、先に GitHub へ上がっていた時に混ぜて生き返るため
function popRec(id){ for (let i = REC.log.length - 1; i >= 0; i--) if (REC.log[i].id === id){ const r = REC.log.splice(i, 1)[0]; (REC.del = REC.del || []).push(r.id + "|" + r.t); break; } saveRec(); syncSoon(); }
function lastOf(){ const m = {}; REC.log.forEach(r => m[r.id] = r); return m; }   // 問題ごとの最後の結果（ドリルは id が "d:単元:番号"）

  const sec = n => n <= 13 ? "直流回路・過渡現象" : n <= 22 ? "単相交流" : n <= 26 ? "三相交流" : n <= 30 ? "静電気" : n <= 35 ? "磁気" : n <= 38 ? "電子理論" : "電気計測";
  let lastSec = "";
  // 動画タブは全39単元（0問の単元も行を残す・解くは出さない）。単元学習タブはこの組の問題がある単元だけ

    const n = pickList(all).length, dr = (DRILLS["u" + String(u.n).padStart(2, "0")] || []).length;
    const dOk = (DRILLS["u" + String(u.n).padStart(2, "0")] || []).filter((_, k) => { const r = last[`d:${u.n}:${k}`]; return r && r.ok; }).length;
    const head = sec(u.n) !== lastSec ? `<div class="secth">${lastSec = sec(u.n)}</div>` : "";
    const solve = !all.length ? "" : `<button class="go" data-un="${u.n}"${n ? "" : " disabled"}>${n ? n + "問 解く" : "なし"}</button>`;
    return head + `<div class="unit"><div class="no">${u.n}</div><div><div class="nm">${u.title.replace(/^\d+\./, "")}</div>
      <div class="sub">毎回 <b>${u.per_session.toFixed(2)}</b>問・<b>${u.pts_per_session.toFixed(1)}</b>点　｜　過去問 ${all.length}問（選んだ難易度 ${sel.length}問${IC_OK}${ok}${IC_NG}${ng}）${dr ? `　｜　ドリル ${dOk}/${dr}` : ""}</div>

        <button class="go ghost" data-dr="${u.n}"${dr ? "" : " disabled"}>ドリル</button>

  }).join("");
}

/* ---------- 単元ドリル ---------- */
function tex(str){   // 「$…$」の部分を KaTeX で数式にする
  return String(str).split(/(\$[^$]+\$)/).map(p => {
    if (p.length > 1 && p[0] === "$" && p[p.length - 1] === "$"){
      try { return katex.renderToString(p.slice(1, -1), {throwOnError: false}); } catch(e) { return p; }
    }
    return p.replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
  }).join("");
}
let DQ = {unit: 0, list: [], i: 0, start: 0, wrong: []};
function startDrill(n){
  const key = "u" + String(n).padStart(2, "0");
  DQ = {unit: n, list: (DRILLS[key] || []).map((it, k) => ({...it, k})), i: 0, wrong: []};
  if (!DQ.list.length) return;
  $("#home").hidden = true; $("#drill").hidden = false; showDrill();
}
function showDrill(){
  const it = DQ.list[DQ.i], u = unitOf(DQ.unit);
  $("#dName").textContent = (u ? u.title : "") + "　ドリル"; $("#dPos").textContent = `${DQ.i + 1} / ${DQ.list.length}`;
  $("#dq").innerHTML = tex(it.q); $("#dJudge").textContent = ""; $("#dNext").disabled = true; $("#dexp").hidden = true;
  const fig = $("#dfig"); fig.hidden = true;
  if (it.fig){ const f = ALL.find(x => x.id === it.fig); if (f) imgURL(f.q).then(u2 => { if (u2){ fig.src = u2; fig.hidden = false; } }); }
  const isW = it.type === "write";
  $("#dch").hidden = isW; $("#dwrite").hidden = !isW; $("#dSelf").hidden = true; $("#dShow").hidden = false;
  if (isW){ padClear(); sizePad(); }
  else $("#dch").innerHTML = it.choices.map((c, k) => `<button class="dbtn" data-k="${k}">${tex(c)}</button>`).join("");
  DQ.start = Date.now(); $("#dbody").scrollTop = 0;
}
function drillDone(ok){
  const it = DQ.list[DQ.i];
  addRec({id: `d:${DQ.unit}:${it.k}`, t: Date.now(), ok, sec: Math.round((Date.now() - DQ.start) / 1000), drill: 1});
  if (!ok) DQ.wrong.push(it);
  const j = $("#dJudge"); j.innerHTML = ok ? IC_OK : IC_NG; j.style.cssText = "font-weight:bold;padding:6px 12px;border-radius:8px;" + (ok ? "background:var(--okbg);color:var(--ok)" : "background:var(--ngbg);color:var(--ng)");
  $("#dexp").innerHTML = (it.type === "write" ? "<b>模範解答</b>　" + tex(it.model) + "<br>" : "") + tex(it.exp || ""); $("#dexp").hidden = false;
  $("#dNext").disabled = false; $("#dNext").textContent = DQ.i + 1 < DQ.list.length ? "次へ" : (DQ.wrong.length ? "間違えた問題をもう一度" : "終わる");
}
$("#dch").addEventListener("click", e => {
  const b = e.target.closest(".dbtn"); if (!b || b.disabled) return;
  const it = DQ.list[DQ.i], k = +b.dataset.k, ok = k === it.ans;
  document.querySelectorAll("#dch .dbtn").forEach(x => { x.disabled = true; const kk = +x.dataset.k; if (kk === it.ans) x.classList.add("right"); else if (kk === k) x.classList.add("wrong"); });
  drillDone(ok);
});
$("#dShow").onclick = () => { const it = DQ.list[DQ.i]; $("#dexp").innerHTML = "<b>模範解答</b>　" + tex(it.model) + "<br>" + tex(it.exp || ""); $("#dexp").hidden = false; $("#dShow").hidden = true; $("#dSelf").hidden = false; };

  $("#drill").hidden = true; goHome();
};

// 「公式を書け」の手書き欄（ペンでも指でも書ける。ここはスクロールしない）
const pad = $("#dpad"), pctx = pad.getContext("2d"); let pcur = null;
function sizePad(){ const r = pad.getBoundingClientRect(), d = window.devicePixelRatio || 1; pad.width = r.width * d; pad.height = r.height * d; pctx.setTransform(d, 0, 0, d, 0, 0); pctx.lineCap = "round"; pctx.lineJoin = "round"; pctx.strokeStyle = "#1b1b1b"; pctx.lineWidth = 2.2; }
function padClear(){ pctx.save(); pctx.setTransform(1, 0, 0, 1, 0, 0); pctx.clearRect(0, 0, pad.width, pad.height); pctx.restore(); }
pad.addEventListener("pointerdown", e => { e.preventDefault(); try { pad.setPointerCapture(e.pointerId); } catch(x) {} const r = pad.getBoundingClientRect(); pcur = {x: e.clientX - r.left, y: e.clientY - r.top}; });
pad.addEventListener("pointermove", e => { if (!pcur) return; const r = pad.getBoundingClientRect(), p2 = {x: e.clientX - r.left, y: e.clientY - r.top}; pctx.beginPath(); pctx.moveTo(pcur.x, pcur.y); pctx.lineTo(p2.x, p2.y); pctx.stroke(); pcur = p2; });
["pointerup", "pointercancel"].forEach(t => pad.addEventListener(t, () => { pcur = null; }));
$("#dClear").onclick = padClear;

/* ---------- 記録のバックアップ（GitHub の非公開リポジトリ） ---------- */
const GHKEY = "denken_gh", GHFILE = "denken_records.json";
let GH = {repo: "yamanezumi42/denken-records", token: "", at: "", err: ""};
try { Object.assign(GH, JSON.parse(localStorage.getItem(GHKEY) || "{}")); } catch(e) {}
const saveGH = () => { try { localStorage.setItem(GHKEY, JSON.stringify(GH)); } catch(e) {} };
const ghHeaders = () => ({"Authorization": "Bearer " + GH.token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"});
const b64e = s => btoa(unescape(encodeURIComponent(s))), b64d = s => decodeURIComponent(escape(atob(s.replace(/\s/g, ""))));
const stamp = () => { const d = new Date(), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
function ghErr(st){ return st === 401 ? "トークンが正しくありません" : st === 403 ? "トークンに書き込みの許可がありません" : st === 404 ? "リポジトリが見つかりません（名前か、トークンの対象を確認）" : "上げられませんでした（" + st + "）"; }
function renderGH(){
  $("#ghState").textContent = !GH.token ? "未設定" : GH.err ? "失敗：" + GH.err : GH.at ? "最後に上げた時刻 " + GH.at : "まだ上げていません";
  $("#ghState").style.color = GH.err ? "var(--ng)" : "";
  $("#ghNow").hidden = !GH.token;
}
let SY = {timer: 0, first: 0, busy: false};
function syncSoon(){
  if (!GH.token) return;
  const now = Date.now();
  if (!SY.first) SY.first = now;
  clearTimeout(SY.timer);
  if (now - SY.first >= 60000){ SY.first = 0; syncNow(); return; }
  SY.timer = setTimeout(() => { SY.first = 0; syncNow(); }, 10000);
}
// 読む→混ぜる→書く。同じ記録（id と日時が同じ）は1つにまとめる
async function syncNow(){
  if (!GH.token || SY.busy) return false;
  SY.busy = true;
  try {
    const url = `https://api.github.com/repos/${GH.repo}/contents/${GHFILE}`;
    const r0 = await fetch(url, {headers: ghHeaders(), cache: "no-store"});
    if (r0.status !== 200 && r0.status !== 404) throw r0.status;
    const cur = r0.status === 200 ? await r0.json() : null;
    if (cur && cur.content){
      const remote = JSON.parse(b64d(cur.content));
      const key = x => x.id + "|" + x.t, have = new Set(REC.log.map(key));
      const del = new Set([...(REC.del || []), ...(remote.del || [])]);
      (remote.log || []).forEach(x => { if (!have.has(key(x))) REC.log.push(x); });
      REC.del = [...del]; REC.log = REC.log.filter(x => !del.has(key(x))); dropOldDrill();
      REC.log.sort((a, b) => a.t - b.t); saveRec();
    }
    const body = {message: "電験の記録 " + stamp(), content: b64e(JSON.stringify({v: REC.v, log: REC.log, del: REC.del || []}))};
    if (cur && cur.sha) body.sha = cur.sha;
    const r1 = await fetch(url, {method: "PUT", headers: ghHeaders(), body: JSON.stringify(body)});
    if (!r1.ok) throw r1.status;
    GH.at = stamp(); GH.err = ""; saveGH(); renderGH();
    if (!$("#home").hidden) renderHome();
    return true;
  } catch(st) {
    GH.err = typeof st === "number" ? ghErr(st) : "通信できませんでした"; saveGH(); renderGH(); return false;
  } finally { SY.busy = false; }
}
$("#ghEdit").onclick = () => { $("#ghForm").hidden = !$("#ghForm").hidden; $("#ghRepo").value = GH.repo; $("#ghToken").value = ""; };

/* ---------- 問題データの自動取り込み（非公開リポジトリ denken-records/data） ---------- */
const DATAPATH = "data/";
async function ghRaw(path){
  const r = await fetch(`https://api.github.com/repos/${GH.repo}/contents/${path}`, {headers: {...ghHeaders(), "Accept": "application/vnd.github.raw"}, cache: "no-store"});
  if (!r.ok) throw r.status;
  return r.json();
}
let DS_BUSY = false;
async function dataSync(say){
  if (!GH.token || DS_BUSY) return 0;
  DS_BUSY = true;
  try {
    say("問題データの版を確かめています…");
    const man = await ghRaw(DATAPATH + "manifest.json");
    const have = await dbAll("packs");
    const todo = man.packs.filter(pk => !have[pk.prefix] || have[pk.prefix].version !== pk.version);
    for (const [k, pk] of todo.entries()){
      say(`${pk.chapter}（${k + 1} / ${todo.length}・${pk.mb}MB）を取り込んでいます…`);
      const pack = await ghRaw(DATAPATH + pk.file);
      await importPack(pack, t => say(`（${k + 1} / ${todo.length}）${t}`));
    }
    say(todo.length ? `${todo.length}分野を取り込みました` : "問題データは最新です");
    return todo.length;
  } catch(st) {
    say("問題データを取り込めませんでした：" + (typeof st === "number" ? ghErr(st) : st)); return -1;
  } finally { DS_BUSY = false; }
}

(async () => {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}

<script>
if ("serviceWorker" in navigator) (function(){
  var sw = navigator.serviceWorker, had = !!sw.controller, fresh = false, done = false, timer = null;
  function idle(){
    var h = document.getElementById("home"), u = document.getElementById("tbUnit");
    var onList = (h && !h.hidden) || (u && !u.hidden);
    return onList && !document.querySelector(".slide.open") && !(window.TB && TB.active());
  }
  function tryReload(){ if (fresh && !done && idle()) { done = true; clearInterval(timer); location.reload(); } }
  sw.addEventListener("controllerchange", function(){
    if (!had) { had = true; return; }          // 初めて入れた時（古い版が無い）は読み込み直さない
    if (fresh) return;
    fresh = true; tryReload(); if (!done) timer = setInterval(tryReload, 1000);
  });
  sw.register("./sw.js").then(function(r){
    document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") r.update().catch(function(){}); });
  }).catch(function(){});
})();
</script>
