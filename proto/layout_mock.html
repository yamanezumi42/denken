<!DOCTYPE html>
<html lang="ja"><head>
<link rel="icon" href="../icon-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>置き方の見本</title>
<link rel="stylesheet" href="../katex/katex.min.css">
<script src="../katex/katex.min.js"></script>
<style>
  :root{--hl:#d9480f;--hlbg:#fff4e6;--ink:#111}
  html{background:#e9e9e9}
  body{margin:0;padding:16px;background:#e9e9e9;color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI",sans-serif}
  .opt{margin:0 auto 28px;width:max-content}
  .hd{display:flex;align-items:center;gap:14px;margin-bottom:8px}
  .hd h2{margin:0;font-size:28px;width:40px}
  .hd label{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:700;cursor:pointer}
  .hd input[type=checkbox]{width:24px;height:24px}
  .hd input[type=text]{width:520px;max-width:60vw;font-size:17px;padding:6px 8px;border:1px solid #999;border-radius:6px}
  .wrap{position:relative;overflow:hidden;border-radius:18px;box-shadow:0 0 0 10px #222}
  .ipad{position:absolute;left:0;top:0;width:1180px;height:820px;background:#fff;transform-origin:0 0;overflow:hidden}
  /* 上の帯・道筋・段の点（今のスライドと同じ） */
  .sbar{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
  .ib{width:48px;height:44px;border:1px solid #bbb;border-radius:8px;background:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0;color:#111}
  .ib svg{width:24px;height:24px}
  .spd{width:auto;padding:0 10px;gap:6px;font-size:16px}
  .spd svg{width:26px;height:20px}
  .band{flex:1;min-width:0;margin:0 12px;height:38px;display:flex;align-items:center;justify-content:center;gap:18px;background:#f3f3f3;border-radius:8px;font-size:17px;white-space:nowrap;overflow:hidden;font-weight:700}
  .band .bw,.band .bk{display:inline-flex;align-items:center;gap:8px}
  .band .lb{color:#666;font-size:14px}
  .route{position:absolute;left:0;right:0;top:54px;height:28px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:700;color:#777}
  .route .ri{padding:1px 8px;border-radius:12px;border:1px solid transparent}
  .route .ri.on{color:var(--hl);border-color:var(--hl);background:var(--hlbg)}
  .route .ra{color:#bbb}
  .dots{position:absolute;left:0;right:0;bottom:2px;height:46px;display:flex;justify-content:center;align-items:center;gap:4px}
  .dots b{width:46px;height:46px;display:flex;align-items:center;justify-content:center}
  .dots i{width:10px;height:10px;border-radius:50%;background:#ccc}
  .dots b.on i{background:var(--hl);transform:scale(1.3)}
  /* 図 */
  .stage{position:absolute}
  .stage svg.fig{position:absolute;left:0;top:0;width:100%;height:100%}
  svg.fig .ink{stroke:#000;fill:none}
  svg.fig .ink.on{stroke:var(--hl)}
  svg.fig text.ink{stroke:none;fill:#000;font-weight:700}
  svg.fig text.ink.on{stroke:none;fill:var(--hl)}
  svg.fig .box{fill:#fff}
  svg.fig path.head,svg.fig circle.dot{fill:#000}
  svg.fig path.head.on,svg.fig circle.dot.on{fill:var(--hl)}
  svg.fig text{font-family:KaTeX_Main,"Times New Roman",serif}
  svg.fig text .v{font-family:KaTeX_Math,"Times New Roman",serif;font-style:italic;font-weight:400}
  svg.fig path.trace{fill:none;stroke-dasharray:1 1}
  /* 字幕と式 */
  .sbox{position:absolute;box-sizing:border-box;background:#fff}
  .cap{line-height:1.45;font-weight:800;word-break:keep-all;overflow-wrap:anywhere;line-break:strict;color:#111}
  .cap .katex{font-weight:normal}
  .cap .h{color:var(--hl)}
  .eqb{display:flex;flex-direction:column;align-items:flex-start;color:#111}
  .eqb .ln{line-height:1.25;padding:.12em 0}
  .eqb .ln.cur{color:var(--hl)}
  .eqb.row{flex-direction:row;align-items:center;flex-wrap:nowrap;gap:.55em}
  .eqb .to{color:#999;font-size:.8em}
  .sp{display:flex;gap:6px;padding:.35em 0 0;line-height:0}
  .sp i{width:7px;height:7px;border-radius:50%;background:#dcdcdc}
  .sp i.done{background:#aaa}
  .sp i.on{background:var(--hl)}
  /* C の吹き出し */
  .bub{border:3px solid var(--hl);border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
  .bub .tail{position:absolute;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:22px solid var(--hl)}
  .bub .tail::after{content:"";position:absolute;left:-12px;top:5px;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:17px solid #fff}
  /* D の帯 */
  .strip{background:#fafafa;border-top:2px solid #e2e2e2;border-bottom:2px solid #e2e2e2}
</style>
</head>
<body>
<main id="list"></main>
<script>

// 抵抗（JIS：長方形）。dir "h" 横 / "v" 縦。中心 (x,y)

  var e = this.el(id, "rect", "ink box"), L = 60, H = 24;
  var w = dir === "v" ? H : L, h = dir === "v" ? L : H;

};
// 電池（横の導線の途中）。x が長い線（＋）、x+20 が短い線
Drawer.prototype.cell = function(id, x, y, o){
  this.wire(id + ":L", [[x, y - 22], [x, y + 22]], o);

  var dx = x1 - x0, dy = y1 - y0, L = Math.sqrt(dx * dx + dy * dy) || 1, ux = dx / L, uy = dy / L, h = 13, w = 7;

    " L" + n(x1 - ux * h + uy * w) + " " + n(y1 - uy * h - ux * w) + " Z");

    d.text(id + ":t" + r[1], cx, r[0] - 28, r[3], {o: r[2] * sep, nw: r[4]});
  });

var SCENES = {};

// 電圧の矢印（電位差）：電位の低い端 xlo から高い端 xhi へ向けた片矢印（矢じりが高い方）。v=0〜1 で補助線→矢印が伸びる

  var e1 = Math.min(1, v * 2), w = Math.max(0, v * 2 - 1), yy = yb + (yt - yb) * e1, oo = o && o.o !== undefined ? o.o : 1;

SCENES.s1 = function(p, d){

  d.text("i5", 705 + (1 - p.z) * 40, 386, "{I}_5=0 A", {anchor: "start", o: p.z, nw: "D", size: 20});

Drawer.prototype.trace = function(id, d, prog, o){
  var e = this.el(id, "path", "ink trace");
  if (e.getAttribute("d") !== d) e.setAttribute("d", d);
  e.setAttribute("pathLength", "1"); e.style.strokeDashoffset = 1 - clamp01(prog);
  return this.style(e, o);
};
function rrect(x, y, w, h, r){
  return "M" + (x + r) + " " + y + " H" + (x + w - r) + " Q" + (x + w) + " " + y + " " + (x + w) + " " + (y + r) +
    " V" + (y + h - r) + " Q" + (x + w) + " " + (y + h) + " " + (x + w - r) + " " + (y + h) + " H" + (x + r) +
    " Q" + x + " " + (y + h) + " " + x + " " + (y + h - r) + " V" + (y + r) + " Q" + x + " " + y + " " + (x + r) + " " + y;
}

function tex(s, el){ try { katex.render(s, el, {throwOnError: true}); } catch (e) { el.textContent = s; console.error("katex", s, e.message); } }

function capBox(o){
  var box = h("div", "sbox" + (o.cls ? " " + o.cls : ""));
  var cap = h("div", "cap", box); cap.style.fontSize = o.cap + "px";
  CAP.forEach(function(c){ var s = h("span", c[2] ? "h" : "", cap); if (c[1]) tex(c[0], s); else s.textContent = c[0]; });

  });

function figure(pad, L){
  var st = h("div", "stage", pad);
  var vb = L.vb.split(" ").map(Number), k = Math.min(L.w / vb[2], L.h / vb[3]), W = vb[2] * k, H = vb[3] * k;
  st.style.left = (L.x + (L.w - W) / 2) + "px"; st.style.top = (L.y + (L.valign === "top" ? 0 : (L.h - H) / 2)) + "px";
  st.style.width = W + "px"; st.style.height = H + "px";
  st.innerHTML = '<svg class="fig" viewBox="' + L.vb + '" xmlns="http://www.w3.org/2000/svg"><g class="parts" stroke-linecap="round" stroke-linejoin="round"></g></svg>';
  var svg = st.querySelector("svg");

  svg.querySelector("g.parts").setAttribute("stroke-width", (STROKE_PX / k).toFixed(2));
  var d = new Drawer(svg); d.emph = groupIds(EMPH); d.dimSet = groupIds(DIM); d.key = "";

  // 枠（今のスライドと同じ作り：名前ごとに、強調した部品をまとめて囲む）

      var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      (G5[g] || []).forEach(function(id){ var e = d.els[id]; if (!e || e.style.display === "none" || +e.style.opacity < 0.05) return;
        var b = e.getBBox(); if (!b.width && !b.height) return;
        x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.width); y1 = Math.max(y1, b.y + b.height); });
      if (x1 > x0) { var fr = d.trace("emframe" + gi, rrect(x0 - 7, y0 - 6, x1 - x0 + 14, y1 - y0 + 12, 8), 1, {keep: 1}); fr.classList.add("on"); fr.style.strokeWidth = (2.6 / k).toFixed(2); }
    });
    d.end();
  }, 0);
  return {el: st, k: k, x: parseFloat(st.style.left), y: parseFloat(st.style.top), W: W, H: H, vb: vb};
}

var saved = {}; try { saved = JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (e) {}

var list = document.getElementById("list"), wraps = [];
function buildAll(){
list.innerHTML = ""; wraps = [];
["A", "B", "C", "D"].forEach(function(key){
  var opt = h("section", "opt", list); opt.dataset.k = key;
  var hd = h("div", "hd", opt); h("h2", "", hd).textContent = key;

  var tx = h("input", "", hd); tx.type = "text"; tx.setAttribute("aria-label", key);
  var s0 = saved[key] || {}; cb.checked = !!s0.ng; tx.value = s0.note || "";

  cb.addEventListener("change", up); tx.addEventListener("input", up);
  var wrap = h("div", "wrap", opt), pad = h("div", "ipad", wrap); wrap.id = "frame" + key;

}
function fitAll(){
  var s = Math.min(1, (window.innerWidth - 32 - 20) / 1180);
  wraps.forEach(function(p){ p[0].style.width = 1180 * s + "px"; p[0].style.height = 820 * s + "px"; p[1].style.transform = s < 1 ? "scale(" + s + ")" : ""; });
}
