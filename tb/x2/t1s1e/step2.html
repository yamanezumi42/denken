<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1-1 電流 段2</title>
<script src="lock.js"></script>
<style>
  html,body{margin:0;height:100%;background:#868e96}
  .scr{position:absolute;left:0;top:0;width:1180px;height:820px;background:#fff;transform-origin:0 0;overflow:hidden;cursor:pointer;
       font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
  .close{position:absolute;left:10px;top:4px;width:46px;height:42px;border:1px solid #bbb;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center}
  .band{position:absolute;left:68px;right:10px;top:6px;height:38px;border-radius:8px;background:#f2f2f2;display:flex;align-items:center;justify-content:center;
        font-size:17px;font-weight:700;color:#111}
  .fig{position:absolute;left:59px;top:90px;width:1062px;height:678px}
  .dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:36px}
  .dots i{width:10px;height:10px;border-radius:50%;background:#ccc}
  .dots i.on{width:13px;height:13px;background:#d9480f;margin-top:-1.5px}
  .fig > svg{position:absolute;left:0;top:0}
  svg text.pl{font-family:inherit;font-weight:800;font-size:17px;fill:#111;text-anchor:middle;dominant-baseline:middle}
  .k{stroke:#000;stroke-linecap:round;stroke-linejoin:round}
  .ray{stroke:#fab005;stroke-width:4.5;stroke-linecap:round}
  /* 文（字幕）：図の中、変化した物のすぐ近く。小さな絵・記号をはめ込む・大事な語は水色のマーカー */
  .nt{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:40px;font-weight:800;color:#111;line-height:1.3;
      opacity:0;transition:opacity .3s;pointer-events:none}
  .nt .u{display:inline-block;white-space:pre}
  .nt .ic{vertical-align:-.1em;margin:0 .06em}
  .nt .hl{font-weight:inherit;background:linear-gradient(transparent 55%,rgba(255,240,100,.75) 55%);background-size:0% 100%;background-repeat:no-repeat;transition:background-size .3s ease-out}
  .nt .hl.on{background-size:100% 100%}
  .tag .hl{background-image:linear-gradient(transparent 55%,rgba(255,146,43,.6) 55%)}
  .tag{opacity:1}
  /* 文は中央（図をぼかした上・lock.js の FLOW）。アニメの拍＝ .mb（乾電池が記号に）→ .ml（豆電球が記号に） */
  /* 変わる物をそっと知らせる輪（変わり終わった時に1回） */
  .ping{opacity:0;transform-box:fill-box;transform-origin:center}
  .mb .pb,.ml .pl2{animation:ping 1s ease-out .95s 1 both}
  @keyframes ping{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
</style>
</head>
<body>
<div class="scr s0" id="scr">
  <div class="close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"><path d="M5 5L19 19M19 5L5 19"/></svg></div>
  <div class="band">1-1　電流</div>
  <div class="fig" id="fig">
    <svg viewBox="464 206 595 380" width="1062" height="678">
      <circle id="glow" r="50" fill="#ffe066" fill-opacity=".6"/>
      <path id="wl" class="k" fill="none" stroke-width="4"/>
      <path id="wr" class="k" fill="none" stroke-width="4"/>
      <!-- 乾電池：出っぱり（a）・＋の側の帯（b）→ 長い線、筒（c）→ 短い太い線 -->
      <rect id="ba" class="k"/>
      <rect id="bc" class="k"/>
      <rect id="bb" class="k"/>
      <path id="bh" d="M700 476 H816" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text id="lp" class="pl" y="446">＋極</text>
      <text id="lm" class="pl" y="446">－極</text>
      <!-- 豆電球：ガラス球 → 丸、フィラメント（左右2本）→ ×、口金 → 縮んで消える -->
      <g id="rays"></g>
      <circle id="gl" class="k" fill="#ffd43b"/>
      <path id="f1" class="k" fill="none"/>
      <path id="f2" class="k" fill="none"/>
      <g id="base">
        <rect x="748" y="322" width="24" height="26" rx="2" fill="#ced4da" class="k" stroke-width="2.6"/>
        <path d="M748 329 H772 M748 336 H772 M748 343 H772" class="k" stroke-width="1.6"/>
        <path d="M754 348 Q760 360 766 348" fill="#495057" class="k" stroke-width="2"/>
      </g>
      <circle class="ping pb" cx="762" cy="490" r="32" fill="none" stroke="#66d9e8" stroke-width="5"/>
      <circle class="ping pl2" cx="760" cy="360" r="32" fill="none" stroke="#66d9e8" stroke-width="5"/>
    </svg>
    <!-- 文は輪の中の同じ所（豆電球と乾電池の間）。どちらが変わってもすぐ近く・目が上下に飛ばない。
         [bat]＝乾電池の絵・[bulb]＝豆電球の絵・[sbat]＝電源の記号・[slamp]＝豆電球の記号・〖〗＝マーカー -->
    <div class="nt tag tb" data-x="753" data-y="545">〖乾電池〗</div>
    <div class="nt tag tl" data-x="760" data-y="385">〖豆電球〗</div>
    <div class="nt n0" data-x="761" data-y="396">銅線でつなぐと、豆電球が〖光ります〗。</div>
    <div class="nt ctr n1" data-x="761" data-y="396">余談ですが、電気の世界では／〖回路図〗というものを用いるので、／それぞれ記号に書き直します。</div>
  </div>
  <div class="dots"><i></i><i class="on"></i><i></i><i></i><i></i><i></i></div>
</div>
<script>
(function(){
  var NS = "http://www.w3.org/2000/svg", $ = function(id){ return document.getElementById(id); };
  function L(a, b, u){ return a + (b - a) * u; }
  function hex(c){ return [1, 3, 5].map(function(i){ return parseInt(c.substr(i, 2), 16); }); }
  function mix(a, b, u){ var A = hex(a), B = hex(b); return "rgb(" + A.map(function(v, i){ return Math.round(L(v, B[i], u)); }).join(",") + ")"; }
  function rect(e, r, u, fa, fb){
    var q = r[0].map(function(v, i){ return L(v, r[1][i], u); });
    ["x", "y", "width", "height", "rx", "stroke-width"].forEach(function(k, i){ e.setAttribute(k, q[i]); });
    e.setAttribute("fill", mix(fa, fb, u));
  }
  function pts(p){ return "M" + p.map(function(q){ return q[0].toFixed(1) + " " + q[1].toFixed(1); }).join(" L"); }
  function line4(x0, y0, x1, y1){ return [0, 1 / 3, 2 / 3, 1].map(function(t){ return [L(x0, x1, t), L(y0, y1, t)]; }); }
  // [x, y, 幅, 高さ, 角の丸み, 線の太さ] の始めと終わり
  var BA = [[686, 482, 10, 16, 2, 2.6], [750.4, 468, 3.2, 44, 1.6, 0]];
  var BB = [[696, 466, 34, 48, 6, 2.6], [750.4, 468, 3.2, 44, 1.6, 0]];
  var BC = [[696, 466, 124, 48, 6, 2.6], [769.5, 479, 5, 22, 2.5, 0]];
  var F1 = [[[752, 318], [752, 306], [756, 298], [760, 306]], line4(743, 343, 777, 377)];
  var F2 = [[[760, 306], [764, 298], [768, 306], [768, 318]], line4(777, 343, 743, 377)];
  var rays = [];
  for (var i = 0; i < 8; i++) { var l = document.createElementNS(NS, "line"); l.setAttribute("class", "ray"); $("rays").appendChild(l); rays.push(l); }
  function ease(u){ return u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; }
  // ub＝乾電池の変わり方、ul＝豆電球の変わり方（0〜1）
  function draw(ub0, ul0){
    var ub = ease(ub0), ul = ease(ul0);
    var cy = L(300, 360, ul), r = L(26, 24, ul), yt = L(336, 360, ul);
    var wc = mix("#b5652a", "#000000", Math.max(ub, ul) * 0 + ub);   // 銅の色 → 黒（電池が記号になる時に）
    $("wl").setAttribute("d", "M" + L(686, 752, ub) + " 490 H478 V" + yt + " H" + L(748, 736, ul));
    $("wr").setAttribute("d", "M" + L(772, 784, ul) + " " + yt + " H1045 V490 H" + L(820, 772, ub));
    $("wl").setAttribute("stroke", wc); $("wr").setAttribute("stroke", wc);
    $("wl").setAttribute("stroke-width", L(4.5, 3.2, ub)); $("wr").setAttribute("stroke-width", L(4.5, 3.2, ub));
    rect($("ba"), BA, ub, "#adb5bd", "#000000");
    rect($("bb"), BB, ub, "#868e96", "#000000");
    rect($("bc"), BC, ub, "#e9ecef", "#000000");
    $("bh").setAttribute("opacity", .7 * (1 - Math.min(1, ub * 2.5)));
    $("lp").setAttribute("x", L(690, 722, ub)); $("lm").setAttribute("x", L(820, 802, ub));
    $("glow").setAttribute("cx", 760); $("glow").setAttribute("cy", cy);
    $("gl").setAttribute("cx", 760); $("gl").setAttribute("cy", cy); $("gl").setAttribute("r", r); $("gl").setAttribute("stroke-width", L(2.6, 3.2, ul));
    [["f1", F1], ["f2", F2]].forEach(function(q){
      $(q[0]).setAttribute("d", pts(q[1][0].map(function(p, j){ return [L(p[0], q[1][1][j][0], ul), L(p[1], q[1][1][j][1], ul)]; })));
      $(q[0]).setAttribute("stroke-width", L(2, 3.2, ul));
    });
    var s = 1 - ul;
    $("base").setAttribute("transform", "translate(" + (760 * ul) + " " + (360 * ul) + ") scale(" + s + ")");
    $("base").setAttribute("opacity", 1 - Math.min(1, ul * 1.4));
    // 記号の豆電球は線の上にあるので、光の線とにじみを短くして下の文にかけない
    var r0 = L(34, 28, ul), rl = L(22, 0, ul);
    $("glow").setAttribute("r", L(50, 34, ul));
    $("rays").setAttribute("opacity", 1 - ul);
    rays.forEach(function(l, i){
      var a = i * Math.PI / 4 + Math.PI / 8, c = Math.cos(a), sn = Math.sin(a);
      l.setAttribute("x1", 760 + r0 * c); l.setAttribute("y1", cy + r0 * sn);
      l.setAttribute("x2", 760 + (r0 + rl) * c); l.setAttribute("y2", cy + (r0 + rl) * sn);
    });
  }
  // 文と名札：図の座標で置く・左から1文字ずつ出す・〖〗の語に水色のマーカーを左から引く
  var VB = [464, 206], K = 678 / 380, fig = $("fig");
  function html(s){ return s.replace(/〖([^〗]*)〗/g, '<b class="hl">$1</b>').replace(/／/g, "<br>"); }
  function put(el, x, y){ el.style.left = ((x - VB[0]) * K) + "px"; el.style.top = ((y - VB[1]) * K) + "px"; }
  function type(el, s, d0){
    d0 = 200 + (d0 || 0); el.innerHTML = html(s);
    var us = [];
    (function walk(n){ [].slice.call(n.childNodes).forEach(function(c){
      if (c.nodeType === 3) { var f = document.createDocumentFragment();
        Array.from(c.textContent).forEach(function(ch){ var u = document.createElement("span"); u.className = "u"; u.textContent = ch; u.style.opacity = 0; f.appendChild(u); us.push(u); });
        c.parentNode.replaceChild(f, c); } else walk(c); }); })(el);
    var dt = Math.min(60, 800 / us.length);
    // 出し方＝1文字ずつ＋下からふわっと（本人が選んだ1番）
    us.forEach(function(u, i){ u.style.transform = "translateY(18px)";
      setTimeout(function(){ u.style.transition = "opacity .3s, transform .3s ease-out"; u.style.opacity = 1; u.style.transform = "none"; }, d0 + i * dt); });
    el.querySelectorAll(".hl").forEach(function(h){ setTimeout(function(){ h.classList.add("on"); }, d0 + us.length * dt + 100); });
  }
  function shown(el, s){ el.innerHTML = html(s); el.querySelectorAll(".hl").forEach(function(h){ h.classList.add("on"); }); }
  var tb = fig.querySelector(".tb"), tl = fig.querySelector(".tl"), n0 = fig.querySelector(".n0"), n1 = fig.querySelector(".n1");
  [tb, tl, n0, n1].forEach(function(el){ el.dataset.s = el.textContent.trim(); put(el, +el.dataset.x, +el.dataset.y); });
  var scr = $("scr"), raf = 0;
  function reset(){ cancelAnimationFrame(raf); shown(tb, tb.dataset.s); shown(tl, tl.dataset.s); draw(0, 0); }
  // 豆電球の名札は、豆電球と一緒に記号の下へすべる
  var draw0 = draw;
  draw = function(ub0, ul0){ draw0(ub0, ul0); var u = ease(ul0); put(tl, 760, L(385, 400, u)); };
  reset();
  // 1秒かけて記号へ（which＝"b" 乾電池／"l" 豆電球）
  function morph(which){
    cancelAnimationFrame(raf);
    var t0 = performance.now();
    (function step(now){
      var u = Math.min(1, (now - t0) / 1000);
      if (which === "b") draw(u, 0); else draw(1, u);
      if (u < 1) raf = requestAnimationFrame(step);
    })(t0);
  }
  // 文→アニメの並び（本文どおり）：文「余談ですが、…それぞれ記号に書き直します。」→ アニメ（乾電池が記号に）→ アニメ（豆電球が記号に）
  // 通し（all.html）の中：最初の形は前の段の最後と同じなので、入ったクリックのまま最初の文へ進む（FLOW が "advance" を受ける）
  FLOW.run({scr: scr, reset: reset, beats: [
    {text: n1, go: function(){ type(n1, n1.dataset.s, 300); }},
    {cls: "mb", go: function(){ type(tb, "〖乾電池の記号〗", 500); morph("b"); }},
    {cls: "ml", go: function(){ type(tl, "〖豆電球の記号〗", 500); morph("l"); }}
  ]});
  function fit(){ var s = Math.min(innerWidth / 1180, innerHeight / 820); scr.style.transform = "scale(" + s + ")"; }
  fit(); addEventListener("resize", fit);
})();
</script>
</body>
</html>
