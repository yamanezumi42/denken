<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1-1 電流 段3</title>
<script src="lock.js"></script>
<style>
  html,body{margin:0;height:100%;background:#868e96}
  .scr{position:absolute;left:0;top:0;width:1180px;height:820px;background:#fff;transform-origin:0 0;overflow:hidden;cursor:pointer;
       font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
  .close{position:absolute;left:10px;top:4px;width:46px;height:42px;border:1px solid #bbb;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center}
  .band{position:absolute;left:68px;right:10px;top:6px;height:38px;border-radius:8px;background:#f2f2f2;display:flex;align-items:center;justify-content:center;
        font-size:17px;font-weight:700;color:#111}
  .fig{position:absolute;left:59px;top:90px;width:1062px;height:678px}
  .fig > svg{position:absolute;left:0;top:0}
  .dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:36px}
  .dots i{width:10px;height:10px;border-radius:50%;background:#ccc}
  .dots i.on{width:13px;height:13px;background:#d9480f;margin-top:-1.5px}
  svg text.pl{font-family:inherit;font-weight:800;font-size:17px;fill:#111;text-anchor:middle;dominant-baseline:middle}
  .k{stroke:#000;stroke-linecap:round;stroke-linejoin:round}
  /* 文：虫めがねの右（変わる所のすぐ横）。1文字ずつ下からふわっと・前の文はその場で薄れる */
  .nt{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;text-align:center;font-size:40px;font-weight:800;color:#111;line-height:1.3;
      opacity:0;transition:opacity .3s;pointer-events:none}
  .nt .u{display:inline-block;white-space:pre}
  .nt .hl{font-weight:inherit;background:linear-gradient(transparent 55%,rgba(255,240,100,.75) 55%);background-size:0% 100%;background-repeat:no-repeat;transition:background-size .3s ease-out}
  .nt .hl.on{background-size:100% 100%}
  .tag .hl{background-image:linear-gradient(transparent 55%,rgba(255,146,43,.6) 55%)}
  /* 文はすべて中央（図をぼかした上・lock.js の FLOW）。アニメの拍＝ .lens（虫めがねで拡大）→ .flow（粒が流れる） */
  .elec .te{opacity:1;transition:none}
  .scr:not(.elec) .te{opacity:0}
  .nt.ct{font-size:44px}
  /* 電子の向きの矢印（青）：流れ出す時に出る */
  .ea{opacity:0}
  .flow .ea{opacity:1;transition:opacity .4s .2s}
  /* 豆電球（記号）：粒が流れ出すと同時に、中が黄色く光の線が出る（以後ずっと光ったまま） */
  .bglow,.brays{opacity:0}
  .flow .bglow,.flow .brays{opacity:1;transition:opacity .4s .2s}
  .flow .bsym{fill:#ffd43b;transition:fill .4s .2s}
  /* 変わった物をそっと知らせる輪 */
  .ping{opacity:0;transform-box:fill-box;transform-origin:center}
  .lens .p1{animation:ping 1s ease-out 1.25s 1 both}
  .flow .p2{animation:ping 1s ease-out .3s 1 both}
  /* 豆電球の中の虫めがね（.fila）：記号の豆電球から大きく広がる */
  .bz{opacity:0;transform-box:view-box;transform-origin:760px 360px;transform:scale(.12);transition:transform .9s ease-in-out,opacity .3s}
  .fila .bz{opacity:1;transform:scale(1)}
  .fil{stroke:#495057}
  #hd{opacity:0}
  /* 熱（.heat）：青い粒がぶつかりながら通り、細い線が 暗い赤→橙→明るい黄色 へ光り、豆電球全体が光る */
  .heat #hd{opacity:1;transition:opacity .3s}
  .heat .fil{animation:hot 2.4s ease-in .3s 1 both}
  @keyframes hot{0%{stroke:#495057}35%{stroke:#8b1a1a}70%{stroke:#fd7e14}100%{stroke:#ffd43b;stroke-width:4.5}}
  .heat .bzg{animation:hotg 2.4s ease-in .3s 1 both}
  @keyframes hotg{0%{fill:#f1f3f5}100%{fill:#fff3bf}}
  .heat .bglow{animation:hotb 1s ease-out 2.7s 1 both}
  @keyframes hotb{100%{fill-opacity:1;r:52}}
  /* 語と同時に絵がそっと光る */
  #el,#ring,#wa,#wb{transition:filter .4s}
  #el.gl,#ring.gl{filter:drop-shadow(0 0 2.5px #4dabf7) drop-shadow(0 0 4px #a5d8ff)}
  #wa.gl,#wb.gl{filter:drop-shadow(0 0 3px #fab005) drop-shadow(0 0 6px #ffd43b)}
  @keyframes ping{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
</style>
</head>
<body>
<div class="scr s0" id="scr">
  <div class="close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"><path d="M5 5L19 19M19 5L5 19"/></svg></div>
  <div class="band">1-1　電流</div>
  <div class="fig" id="fig">
    <svg viewBox="464 206 595 380" width="1062" height="678">
      <defs>
        <clipPath id="cl"><circle id="clc" cx="600" cy="360" r="0"/></clipPath>
        <marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 Z" fill="#1c7ed6"/>
        </marker>
      </defs>
      <!-- 段2の終わり＝記号の回路（銅線は黒） -->
      <path id="wa" class="k" fill="none" stroke-width="3.2" d="M752 490 H478 V360 H736"/>
      <path id="wb" class="k" fill="none" stroke-width="3.2" d="M784 360 H1045 V490 H772"/>
      <rect x="750.4" y="468" width="3.2" height="44" rx="1.6" fill="#000"/>
      <rect x="769.5" y="479" width="5" height="22" rx="2.5" fill="#000"/>
      <text class="pl" x="722" y="446">＋極</text>
      <text class="pl" x="802" y="446">－極</text>
      <!-- 豆電球の光（粒が流れ出すと同時に光り、以後ずっと光ったまま） -->
      <circle class="bglow" cx="760" cy="360" r="40" fill="#ffe066" fill-opacity=".6"/>
      <g class="brays" stroke="#fab005" stroke-width="4" stroke-linecap="round">
        <path d="M790.5 372.6 L804.4 378.4 M772.6 390.5 L778.4 404.4 M747.4 390.5 L741.6 404.4 M729.5 372.6 L715.6 378.4 M729.5 347.4 L715.6 341.6 M747.4 329.5 L741.6 315.6 M772.6 329.5 L778.4 315.6 M790.5 347.4 L804.4 341.6"/>
      </g>
      <circle class="k bsym" cx="760" cy="360" r="24" fill="#fff" stroke-width="3.2"/>
      <path class="k" d="M743 343 L777 377 M777 343 L743 377" stroke-width="3.2"/>
      <!-- 輪全体の電子（クリック2で線に沿って回る） -->
      <g id="ring"></g>
      <!-- 虫めがね：線の上の小さな輪から、上へ大きく広がる -->
      <g id="lens" opacity="0">
        <path id="cone" fill="#e7f5ff" fill-opacity=".7" stroke="#adb5bd" stroke-width="1.6"/>
        <circle cx="600" cy="360" r="13" fill="none" stroke="#495057" stroke-width="3"/>
        <circle id="lb" cx="600" cy="360" r="0" fill="#fff"/>
        <g clip-path="url(#cl)">
          <!-- 線の断面（中身が見える銅） -->
          <rect x="520" y="250" width="160" height="44" fill="#f8e3d2"/>
          <path d="M520 250 H680 M520 294 H680" stroke="#b5652a" stroke-width="2.4"/>
          <g id="el"></g>
          <path class="ea" d="M634 236 H568" stroke="#1c7ed6" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/>
        </g>
        <circle id="lr" cx="600" cy="360" r="0" fill="none" stroke="#495057" stroke-width="5"/>
      </g>
      <circle class="ping p1" cx="600" cy="276" r="64" fill="none" stroke="#66d9e8" stroke-width="5"/>
      <circle class="ping p2" cx="600" cy="276" r="64" fill="none" stroke="#66d9e8" stroke-width="5"/>
      <!-- 豆電球の中の虫めがね：記号の豆電球から右上へ大きく広がり、中の細い線（ぐるぐる巻きのフィラメント）を見せる -->
      <g class="bz">
        <path d="M748 350 L848 252 M772 350 L952 252" stroke="#adb5bd" stroke-width="1.6" fill="none"/>
        <circle class="bzg" cx="900" cy="284" r="62" fill="#f1f3f5" stroke="#495057" stroke-width="5"/>
        <path d="M866 338 L868 298 M934 338 L932 298" stroke="#868e96" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path id="fil" class="fil" d="M868 298 q4 -26 8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <g id="hd"></g>
      </g>
    </svg>
    <!-- 〖〗＝マーカー、／＝改行 -->
    <div class="nt tag te" data-x="600" data-y="316">〖電子〗</div>
    <!-- 文は本文（docs/script_1-1_text.md）どおり。1文ずつ出す -->
    <div class="nt ct ctr qa" data-x="761" data-y="396">では、なぜ豆電球は〖光った〗のでしょう？</div>
    <div class="nt ct ctr q2" data-x="761" data-y="396">……答えは、〖銅線の中〗をのぞくと分かります。</div>
    <div class="nt ctr n1" data-x="761" data-y="396">銅線の中には、／〖電子〗という小さな粒がたくさん入っています。</div>
    <div class="nt ctr nf" data-x="761" data-y="396">乾電池をつなぐと、この粒が〖一斉に動き出し〗、／輪をぐるりと回ります。</div>
    <div class="nt ctr n2" data-x="761" data-y="396">この電子の粒の流れを、〖電流〗といいます。</div>
    <div class="nt ctr fa" data-x="761" data-y="396">豆電球の中には、〖細い線〗があります。</div>
    <div class="nt ctr fb" data-x="761" data-y="396">電子がこの細い線を通るとき、／ぶつかりながら進むので〖熱〗が出て、／とても熱くなった線が光って見えるのです。</div>
  </div>
  <div class="dots"><i></i><i></i><i class="on"></i><i></i><i></i><i></i></div></div>
<script>
(function(){
  var NS = "http://www.w3.org/2000/svg", $ = function(id){ return document.getElementById(id); };
  function L(a, b, u){ return a + (b - a) * u; }
  function ease(u){ return u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; }
  function dot(g, r){ var c = document.createElementNS(NS, "circle"); c.setAttribute("r", r); c.setAttribute("fill", "#339af0"); c.setAttribute("stroke", "#1864ab"); c.setAttribute("stroke-width", .9); g.appendChild(c); return c; }
  // 虫めがねの中の電子：4段にぎっしり（少しだけばらつかせる）
  var EL = [], X0 = 516, W = 168;
  [259, 268, 277, 286].forEach(function(y, r){
    for (var x = X0 + (r % 2) * 5; x < X0 + W; x += 10) EL.push({x: x + ((x * 7 + r * 13) % 5 - 2) * .5, y: y + ((x * 3 + r) % 3 - 1) * .7, c: dot($("el"), 3.1)});
  });
  // 輪全体の電子：－極から出て右の線→上の線（右から左）→左の線→＋極へ。豆電球の記号の中は通さない
  var RP = document.createElementNS(NS, "path"); RP.setAttribute("d", "M772 490 H1045 V360 H478 V490 H752");
  var RL = 0; try { RL = RP.getTotalLength(); } catch (e) {}
  if (!RL) RL = 273 + 130 + 567 + 130 + 274;
  function rpt(s){   // パスの上の点（直線だけなので手で計算）
    var seg = [[772, 490, 1045, 490], [1045, 490, 1045, 360], [1045, 360, 478, 360], [478, 360, 478, 490], [478, 490, 752, 490]];
    for (var i = 0; i < seg.length; i++) { var q = seg[i], l = Math.abs(q[2] - q[0]) + Math.abs(q[3] - q[1]);
      if (s <= l) { var t = s / l; return [L(q[0], q[2], t), L(q[1], q[3], t)]; } s -= l; }
    return [752, 490];
  }
  var RD = []; for (var s = 0; s < RL; s += 20) RD.push({s: s, c: dot($("ring"), 3.4)});
  var off = 0, run = false, raf = 0, last = 0;
  function place(){
    EL.forEach(function(d){ var x = X0 + ((((d.x - X0 - off * 1.3) % W) + W) % W); d.c.setAttribute("cx", x); d.c.setAttribute("cy", d.y); });
    RD.forEach(function(d){ var p = rpt(((d.s + off) % RL + RL) % RL);
      var hide = (p[1] === 360 && p[0] > 731 && p[0] < 789);
      d.c.setAttribute("cx", p[0]); d.c.setAttribute("cy", p[1]); d.c.setAttribute("opacity", hide ? 0 : 1); });
  }
  function loop(now){ if (last) off += (now - last) / 1000 * 34; last = now; place(); if (run) raf = requestAnimationFrame(loop); }
  loop.free = true;   // 粒がずっと流れる動きは、クリックの受付を止めない
  // 虫めがねが線の上の小さな輪から上へ広がる（0〜1）
  function lens(u0){
    var u = ease(u0), cy = L(360, 276, u), r = L(13, 64, u);
    $("lens").setAttribute("opacity", Math.min(1, u0 * 4));
    ["lb", "lr", "clc"].forEach(function(id){ $(id).setAttribute("cy", cy); $(id).setAttribute("r", r); });
    $("cone").setAttribute("d", "M587 360 L" + (600 - r) + " " + cy + " L" + (600 + r) + " " + cy + " L613 360 Z");
  }
  // 文と名札
  var VB = [464, 206], K = 678 / 380, fig = $("fig");
  function html(s){ return s.replace(/〖([^〗]*)〗/g, '<b class="hl">$1</b>').replace(/／/g, "<br>"); }
  function put(el){ el.style.left = ((+el.dataset.x - VB[0]) * K) + "px"; el.style.top = ((+el.dataset.y - VB[1]) * K) + "px"; }
  function type(el, d0){
    d0 = 200 + (d0 || 0); el.innerHTML = html(el.dataset.s);
    var us = [];
    (function walk(n){ [].slice.call(n.childNodes).forEach(function(c){
      if (c.nodeType === 3) { var f = document.createDocumentFragment();
        Array.from(c.textContent).forEach(function(ch){ var u = document.createElement("span"); u.className = "u"; u.textContent = ch; u.style.opacity = 0; f.appendChild(u); us.push(u); });
        c.parentNode.replaceChild(f, c); } else walk(c); }); })(el);
    var dt = Math.min(60, 800 / us.length);
    us.forEach(function(u, i){ u.style.transform = "translateY(18px)";
      setTimeout(function(){ u.style.transition = "opacity .3s, transform .3s ease-out"; u.style.opacity = 1; u.style.transform = "none"; }, d0 + i * dt); });
    var hs = el.querySelectorAll(".hl"), k = 0;
    // マーカーは、その語を打ち終えた瞬間に引く（文の語と絵の光を合わせるため、その時刻を返す）
    var tw = d0 + us.length * dt + 100;
    if (hs.length) { var pre = 0; (function walk(n){ [].slice.call(n.childNodes).forEach(function(c){ if (k) return; if (c.classList && c.classList.contains("hl")) { k = 1; tw = d0 + (pre + c.textContent.length) * dt + 150; } else if (c.classList && c.classList.contains("u")) pre++; else walk(c); }); })(el); }
    hs.forEach(function(h){ setTimeout(function(){ h.classList.add("on"); }, tw); });
    return tw;
  }
  // 文で語を言った瞬間に、その絵をそっと光らせる
  function glow(ids, t){ setTimeout(function(){ ids.forEach(function(id){ var g = $(id); g.classList.add("gl"); setTimeout(function(){ g.classList.remove("gl"); }, 1300); }); }, t); }
  function shown(el){ el.innerHTML = html(el.dataset.s); el.querySelectorAll(".hl").forEach(function(h){ h.classList.add("on"); }); }
  var NT = [].slice.call(fig.querySelectorAll(".nt"));
  NT.forEach(function(el){ el.dataset.s = el.textContent.trim(); put(el); shown(el); });
  var te = fig.querySelector(".te"), n1 = fig.querySelector(".n1"), n2 = fig.querySelector(".n2"),
      qa = fig.querySelector(".qa"), q2 = fig.querySelector(".q2"),
      nf = fig.querySelector(".nf"), fa = fig.querySelector(".fa"), fb = fig.querySelector(".fb");
  // 細い線の中の青い粒：線に沿って進み、ぶつかるように小刻みに揺れる（ずっと続く動き＝クリックの受付は止めない）
  var FIL = $("fil"), FL = 0; try { FL = FIL.getTotalLength(); } catch (e) {}
  var HD = []; for (var h = 0; h < 6; h++) HD.push(dot($("hd"), 2.6));
  var hot = false, hraf = 0, ht = 0;
  function heatLoop(now){
    if (!ht) ht = now; var t = (now - ht) / 1000;
    HD.forEach(function(c, i){
      var s = ((t * 14 + i * FL / HD.length) % FL + FL) % FL, p = FL ? FIL.getPointAtLength(s) : {x: 900, y: 280};
      var j = Math.sin(now / 37 + i * 7) * 1.6, k = Math.cos(now / 29 + i * 3) * 1.6;
      c.setAttribute("cx", p.x + j); c.setAttribute("cy", p.y + k);
    });
    if (hot) hraf = requestAnimationFrame(heatLoop);
  }
  heatLoop.free = true;
  function reset(){ if (typeof hot !== "undefined") { hot = false; cancelAnimationFrame(hraf); } run = false; cancelAnimationFrame(raf); off = 0; last = 0; lens(0); $("lens").setAttribute("opacity", 0); $("ring").setAttribute("opacity", 0); place(); }
  reset();
  var scr = $("scr");
  function T(el){ return {text: el, go: function(){ type(el, 300); }}; }
  // 文→アニメの並び（本文どおり・1文ずつ）：
  //   文「では、なぜ…？」→ 文「答えは、銅線の中を…」→ アニメ（虫めがねで銅線の中を拡大）
  //   → 文「銅線の中には、電子という…」→ アニメ（名札「電子」・粒がそっと光る）
  //   → 文「乾電池をつなぐと、この粒が一斉に動き出し…」→ アニメ（粒が一斉に流れ、輪をぐるりと回る・同時に豆電球が光る）
  //   → 文「この電子の粒の流れを、電流と…」→ アニメ（輪の流れ全体がそっと光る）
  //   → 文「豆電球が光ったのは…」→ アニメ（流れが豆電球の中を通る所がそっと光る）
  // 通し（all.html）の中：最初の形は前の段の最後と同じ＝読み込んだら最初の文から（FLOW）
  FLOW.run({scr: scr, reset: reset, beats: [
    T(qa),
    {text: q2, go: function(){ glow(["wa", "wb"], type(q2, 300)); }},
    {cls: "lens", go: function(){
      var t0 = performance.now() + 300;
      (function step(now){ var u = Math.max(0, Math.min(1, (now - t0) / 900)); lens(u); if (u < 1) raf = requestAnimationFrame(step); })(performance.now());
    }},
    {text: n1, go: function(){ cancelAnimationFrame(raf); lens(1); type(n1, 300); }},
    {cls: "elec", go: function(){ type(te, 300); glow(["el"], 500); }},
    T(nf),
    {cls: "flow", go: function(){
      $("ring").setAttribute("opacity", 1); glow(["el", "ring"], 300);
      run = true; last = 0; raf = requestAnimationFrame(loop);
    }},
    T(n2),
    {cls: "named", go: function(){ glow(["ring"], 300); }},
    T(fa),
    {cls: "fila"},
    T(fb),
    {cls: "heat", go: function(){ hot = true; ht = 0; hraf = requestAnimationFrame(heatLoop); }}
  ]});
  function fit(){ var s = Math.min(innerWidth / 1180, innerHeight / 820); scr.style.transform = "scale(" + s + ")"; }
  fit(); addEventListener("resize", fit);
})();
</script>
</body>
</html>
