<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1-1 電流 段5</title>
<script src="lock.js"></script>
<style>
  html,body{margin:0;height:100%;background:#868e96}
  .scr{position:absolute;left:0;top:0;width:1180px;height:820px;background:#fff;transform-origin:0 0;overflow:hidden;cursor:pointer;
       font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
  .close{position:absolute;left:10px;top:4px;width:46px;height:42px;border:1px solid #bbb;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center}
  .band{position:absolute;left:68px;right:10px;top:6px;height:38px;border-radius:8px;background:#f2f2f2;display:flex;align-items:center;justify-content:center;
        font-size:17px;font-weight:700;color:#111}
  .fig{position:absolute;left:59px;top:90px;width:1062px;height:678px}
  .fig > svg{position:absolute;left:0;top:0}
  .dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:36px}
  .dots i{width:10px;height:10px;border-radius:50%;background:#ccc}
  .dots i.on{width:13px;height:13px;background:#d9480f;margin-top:-1.5px}
  svg text.pl{font-family:inherit;font-weight:800;font-size:17px;fill:#111;text-anchor:middle;dominant-baseline:middle}
  .k{stroke:#000;stroke-linecap:round;stroke-linejoin:round}
  /* 文：1文字ずつ下からふわっと・大事な語は黄色のマーカー／名札は絵の下で橙。文の時のぼかし（案1）と ア/イ は lock.js の FLOW が受け持つ */
  .nt{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;text-align:center;font-size:40px;font-weight:800;color:#111;line-height:1.3;
      opacity:0;transition:opacity .3s,text-shadow .4s;pointer-events:none}
  .nt.vis{opacity:1}
  .nt.ctr{font-size:44px}
  .nt .u{display:inline-block;white-space:pre}
  .nt .hl,.tagI .hl{font-weight:inherit;background:linear-gradient(transparent 55%,rgba(255,240,100,.75) 55%);background-size:0% 100%;background-repeat:no-repeat;transition:background-size .3s ease-out}
  .nt .hl.on,.tagI .hl.on{background-size:100% 100%}
  .tag .hl,.tagI .hl{background-image:linear-gradient(transparent 55%,rgba(255,146,43,.6) 55%)}
  /* 電流の記号の名札：矢印の下。I は動かず、右へ「 = 2 A」が伸びる */
  .tagI{position:absolute;white-space:nowrap;font-weight:800;color:#111;pointer-events:none;opacity:0}
  .tagI .l1{font-size:56px;line-height:1.1}
  .tagI .l2{font-size:20px;line-height:1.2;color:#343a40;margin-left:-8px}
  .tagI .c{display:inline-block;white-space:pre;opacity:0;transform:translateY(18px)}
  .tagI .c.in{opacity:1;transform:none;transition:opacity .3s,transform .3s ease-out}
  .ti .tagI{opacity:1}
  .scr:not(.ti) .tagI{opacity:0 !important}   /* 出す前の名札は、ぼかしの時も見せない */
  .tagI .x,.tagI .ga{transition:text-shadow .4s,opacity .3s}
  /* 電流の矢印（橙）：線の外側・少し離して */
  #arw{opacity:0;transition:opacity .4s}
  .arw #arw{opacity:1}
  /* 電流そのものの流れ（段4と同じ案1＋矢じり）：光る小さな橙の矢印が＋極→－極へ流れる。粒が多いほど、光る矢印も多く・大きく */
  .fl{opacity:0;transition:opacity .8s;filter:drop-shadow(0 0 2px #ffa94d) drop-shadow(0 0 5px #ffc078)}
  .arw #cur{opacity:1}
  .fl .fs{fill:none;stroke:#ff922b;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
  .fl .fh{fill:#ff922b;stroke:#ff922b;stroke-width:1;stroke-linejoin:round}
  /* 語や変化と同時に、絵がそっと光る */
  #el,#ring,#arw,#lamp{transition:filter .4s}
  #el.gl,#ring.gl{filter:drop-shadow(0 0 2.5px #4dabf7) drop-shadow(0 0 4px #a5d8ff)}
  #arw.gl,#lamp.gl{filter:drop-shadow(0 0 3px #fab005) drop-shadow(0 0 7px #ffd43b)}
  .gl{text-shadow:0 0 10px #ffd43b,0 0 20px #ffe066}
</style>
</head>
<body>
<div class="scr" id="scr">
  <div class="close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"><path d="M5 5L19 19M19 5L5 19"/></svg></div>
  <div class="band">1-1　電流</div>
  <div class="fig" id="fig">
    <!-- 絵は画面の真ん中（上下左右の余白をそろえる）：図の中身 x470〜1052・y210〜575（名札 I まで）の中心を枠の中心へ -->
    <svg viewBox="461 200 600 383" width="1062" height="678">
      <defs>
        <clipPath id="cl"><circle cx="600" cy="276" r="64"/></clipPath>
        <marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 Z" fill="#1c7ed6"/>
        </marker>
        <marker id="oh" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="2" markerHeight="2" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 Z" fill="#f76707"/>
        </marker>
      </defs>
      <path class="k" fill="none" stroke-width="3.2" d="M752 490 H478 V360 H736"/>
      <path class="k" fill="none" stroke-width="3.2" d="M784 360 H1045 V490 H772"/>
      <rect x="750.4" y="468" width="3.2" height="44" rx="1.6" fill="#000"/>
      <rect x="769.5" y="479" width="5" height="22" rx="2.5" fill="#000"/>
      <text class="pl" x="722" y="446">＋極</text><text class="pl" x="802" y="446">－極</text>
      <!-- 豆電球の記号：流れる粒が多いほど、にじみが大きく・光の線が長く・中が濃い黄色に -->
      <g id="lamp">
        <circle id="lg" cx="760" cy="360" fill="#ffe066"/>
        <g id="rays"></g>
        <circle id="lc" class="k" cx="760" cy="360" r="24" stroke-width="3.2"/>
        <path class="k" d="M743 343 L777 377 M777 343 L743 377" stroke-width="3.2"/>
      </g>
      <g id="cur" class="fl"><path class="fs"/><path class="fh"/></g>
      <g id="ring"></g>
      <!-- 電流の矢印：左下の線の外側。＋極から出て左へ（＋極→－極の向き）。太さ＝流れる粒の多さ -->
      <path id="arw" d="M712 508 H552" fill="none" stroke="#f76707" stroke-linecap="butt" marker-end="url(#oh)"/>
      <g id="lens">
        <path fill="#e7f5ff" fill-opacity=".7" stroke="#adb5bd" stroke-width="1.6" d="M587 360 L536 276 L664 276 L613 360 Z"/>
        <circle cx="600" cy="360" r="13" fill="none" stroke="#495057" stroke-width="3"/>
        <circle cx="600" cy="276" r="64" fill="#fff"/>
        <g clip-path="url(#cl)">
          <rect x="520" y="250" width="160" height="44" fill="#f8e3d2"/>
          <path d="M520 250 H680 M520 294 H680" stroke="#b5652a" stroke-width="2.4"/>
          <g id="el"></g>
          <path d="M634 236 H568" stroke="#1c7ed6" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/>
        </g>
        <circle cx="600" cy="276" r="64" fill="none" stroke="#495057" stroke-width="5"/>
      </g>
    </svg>
    <div class="nt tag te vis" data-x="600" data-y="316">〖電子〗</div>
    <div class="tagI tag" id="tagI" data-x="568" data-y="548">
      <div class="l1"><b class="hl h1"><span class="x">I</span></b><b class="hl h2" id="ex"></b></div>
      <div class="l2">電流</div>
    </div>
  </div>
  <div class="dots"><i></i><i></i><i></i><i></i><i></i><i class="on"></i><i></i></div>
</div>
<script>
(function(){
  var NS = "http://www.w3.org/2000/svg", $ = function(id){ return document.getElementById(id); };
  function L(a, b, u){ return a + (b - a) * u; }
  function ease(u){ return u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; }
  function cl(v){ return Math.max(0, Math.min(1, v)); }
  function T(f, d){ return setTimeout(f, d); }
  function dot(g, r){ var c = document.createElementNS(NS, "circle"); c.setAttribute("r", r); c.setAttribute("fill", "#339af0"); c.setAttribute("stroke", "#1864ab"); c.setAttribute("stroke-width", .9); g.appendChild(c); return c; }
  // 流れる粒の多さ D（0〜1）。粒ごとに順番 rk を持ち、rk < D の粒だけ見せる（黄金比で散らして偏らせない）
  var D = .5, EL = [], X0 = 516, W = 168, n = 0;
  for (var r = 0; r < 6; r++) {
    var y = 255.5 + r * 6.6;
    for (var x = X0 + (r % 2) * 3.5; x < X0 + W; x += 7) EL.push({x: x + ((n * 7) % 5 - 2) * .4, y: y + ((n * 3) % 3 - 1) * .6, rk: (n++ * .618034) % 1, c: dot($("el"), 2.7)});
  }
  function rpt(s){   // －極から出て右の線→上の線（右から左）→左の線→＋極へ
    var seg = [[772, 490, 1045, 490], [1045, 490, 1045, 360], [1045, 360, 478, 360], [478, 360, 478, 490], [478, 490, 752, 490]];
    for (var i = 0; i < seg.length; i++) { var q = seg[i], l = Math.abs(q[2] - q[0]) + Math.abs(q[3] - q[1]);
      if (s <= l) { var t = s / l; return [L(q[0], q[2], t), L(q[1], q[3], t)]; } s -= l; }
    return [752, 490];
  }
  var RL = 273 + 130 + 567 + 130 + 274, RD = [];
  for (var s = 0, i = 0; s < RL; s += 10, i++) RD.push({s: s, rk: (i * .618034) % 1, c: dot($("ring"), 3.2)});
  var rays = [];
  for (var j = 0; j < 8; j++) { var l = document.createElementNS(NS, "line"); l.setAttribute("stroke", "#fab005"); l.setAttribute("stroke-width", 4); l.setAttribute("stroke-linecap", "round"); $("rays").appendChild(l); rays.push(l); }
  function hexmix(a, b, u){ var A = [1, 3, 5].map(function(k){ return parseInt(a.substr(k, 2), 16); }), B = [1, 3, 5].map(function(k){ return parseInt(b.substr(k, 2), 16); });
    return "rgb(" + A.map(function(v, k){ return Math.round(L(v, B[k], u)); }).join(",") + ")"; }
  var off = 0, last = 0;
  function draw(){
    EL.forEach(function(d){ var x = X0 + ((((d.x - X0 - off * 1.3) % W) + W) % W);
      d.c.setAttribute("cx", x); d.c.setAttribute("cy", d.y); d.c.setAttribute("opacity", cl((D - d.rk) * 14)); });
    RD.forEach(function(d){ var p = rpt(((d.s + off) % RL + RL) % RL);
      var hide = (p[1] === 360 && p[0] > 731 && p[0] < 789);
      d.c.setAttribute("cx", p[0]); d.c.setAttribute("cy", p[1]); d.c.setAttribute("opacity", hide ? 0 : cl((D - d.rk) * 14)); });
    var b = D;
    $("lg").setAttribute("r", 27 + 15 * b); $("lg").setAttribute("fill-opacity", .15 + .55 * b);
    $("lc").setAttribute("fill", hexmix("#fff9db", "#ffd43b", b));
    rays.forEach(function(ln, k){ var a = k * Math.PI / 4 + Math.PI / 8, c = Math.cos(a), sn = Math.sin(a), r0 = 30, r1 = 30 + 18 * b;
      ln.setAttribute("x1", 760 + r0 * c); ln.setAttribute("y1", 360 + r0 * sn); ln.setAttribute("x2", 760 + r1 * c); ln.setAttribute("y2", 360 + r1 * sn);
      ln.setAttribute("opacity", cl(b * 1.6)); });
    $("arw").setAttribute("stroke-width", 2.5 + 7.5 * b);   // 矢印の太さ＝粒の多さ
    flow($("cur"), off, b);
  }
  // ===== 電流そのものの流れ：光る小さな橙の矢印（筋＋矢じり）が、線に沿って＋極→－極へ次々に流れる（段4と同じ形）。
  //       粒の多さ D に合わせて、見える矢印の数（rk < D）と大きさが変わる =====
  var CG = [[752, 490, 478, 490], [478, 490, 478, 360], [478, 360, 1045, 360], [1045, 360, 1045, 490], [1045, 490, 772, 490]], CT = 0;
  CG.forEach(function(q){ CT += Math.abs(q[2] - q[0]) + Math.abs(q[3] - q[1]); });
  function cpt(s){ for (var i = 0; i < CG.length; i++) { var q = CG[i], l = Math.abs(q[2] - q[0]) + Math.abs(q[3] - q[1]);
      if (s <= l) { var t = s / l; return [L(q[0], q[2], t), L(q[1], q[3], t)]; } s -= l; } return [772, 490]; }
  function hideL(p){ return p[1] === 360 && p[0] > 729 && p[0] < 791; }   // 豆電球の記号の中は描かない
  function flow(g, sh, Dv){
    var sd = "", hd = "", k = .75 + .45 * Dv, f = function(q){ return q[0].toFixed(1) + " " + q[1].toFixed(1); };
    for (var h = 0, i = 0; h < CT; h += 20, i++) {
      if ((i * .618034) % 1 > Dv * .55) continue;   // 粒が多いほど、光る矢印も多い（D=1 で約40ごと）
      var s = ((h + sh) % CT + CT) % CT, tail = s - 15 * k, neck = s - 6 * k;
      if (tail < 0) continue;   // 乾電池のすき間（－極→＋極）はまたがない
      var p = cpt(s), pts = [];
      for (var b = tail; b < neck; b += 3) pts.push(cpt(b));
      pts.push(cpt(neck));
      if (hideL(p) || pts.some(hideL)) continue;
      var q = cpt(s - 1), tx = p[0] - q[0], ty = p[1] - q[1], tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      var nx = p[0] - tx * 7 * k, ny = p[1] - ty * 7 * k, w = 4.6 * k;
      sd += "M" + pts.map(f).join(" L");
      hd += "M" + f(p) + " L" + f([nx - ty * w, ny + tx * w]) + " L" + f([nx + ty * w, ny - tx * w]) + " Z";
    }
    g.querySelector(".fs").setAttribute("d", sd); g.querySelector(".fs").setAttribute("stroke-width", 3.4 * k);
    g.querySelector(".fh").setAttribute("d", hd);
  }
  // D を時間で動かす：[[開始ms, 長さms, 目標], ...]。終わるまでクリックを受け付けない（空の setTimeout で lock.js に数えさせる）
  var plan = [], t0 = 0, D0 = .5;
  function anim(p){ plan = p; t0 = performance.now(); D0 = D; var e = 0; p.forEach(function(q){ e = Math.max(e, q[0] + q[1]); }); T(function(){}, e + 50); }
  function stepD(now){
    var t = now - t0, from = D0;
    for (var k = 0; k < plan.length; k++) { var q = plan[k];
      if (t < q[0]) { D = from; return; }
      if (t < q[0] + q[1]) { D = L(from, q[2], ease((t - q[0]) / q[1])); return; }
      from = q[2]; }
    D = from;
  }
  function loop(now){ if (last) off += (now - last) / 1000 * 34; last = now; stepD(now); draw(); requestAnimationFrame(loop); }
  loop.free = true;   // 粒がずっと流れる動きは、クリックの受付を止めない
  // 文と名札
  var VB = [461, 200], K = 1062 / 600, fig = $("fig");
  function html(s){ return s.replace(/〖([^〗]*)〗/g, '<b class="hl">$1</b>').replace(/／/g, "<br>"); }
  function put(el){ el.style.left = ((+el.dataset.x - VB[0]) * K) + "px"; el.style.top = ((+el.dataset.y - VB[1]) * K) + "px"; }
  function type(el, d0){
    d0 = 200 + (d0 || 0); el.innerHTML = html(el.dataset.s);
    var us = [];
    (function walk(nd){ [].slice.call(nd.childNodes).forEach(function(c){
      if (c.nodeType === 3) { var f = document.createDocumentFragment();
        Array.from(c.textContent).forEach(function(ch){ var u = document.createElement("span"); u.className = "u"; u.textContent = ch; u.style.opacity = 0; f.appendChild(u); us.push(u); });
        c.parentNode.replaceChild(f, c); } else walk(c); }); })(el);
    var dt = Math.min(60, 800 / us.length);
    us.forEach(function(u, i){ u.style.transform = "translateY(18px)";
      T(function(){ u.style.transition = "opacity .3s, transform .3s ease-out"; u.style.opacity = 1; u.style.transform = "none"; }, d0 + i * dt); });
    var hs = el.querySelectorAll(".hl"), k = 0, end = d0 + us.length * dt + 300, tw = end - 200;
    if (hs.length) { var pre = 0; (function walk(nd){ [].slice.call(nd.childNodes).forEach(function(c){ if (k) return; if (c.classList && c.classList.contains("hl")) { k = 1; tw = d0 + (pre + c.textContent.length) * dt + 150; } else if (c.classList && c.classList.contains("u")) pre++; else walk(c); }); })(el); }
    hs.forEach(function(h){ T(function(){ h.classList.add("on"); }, tw); });
    return {hl: tw, end: Math.max(end, tw + 300)};
  }
  function glow(els, t){ T(function(){ els.forEach(function(g){ g.classList.add("gl"); T(function(){ g.classList.remove("gl"); }, 1300); }); }, t); }
  var te = fig.querySelector(".te"); te.dataset.s = te.textContent.trim(); put(te); te.innerHTML = html(te.dataset.s); te.querySelector(".hl").classList.add("on");
  put($("tagI")); $("tagI").style.transform = "translate(0,-50%)";
  // 名札「I」の右に伸びる「 = 2 A」
  var EX = [" ", "=", " ", "2", " ", "A"];
  function resetTag(){
    $("ex").innerHTML = EX.map(function(ch, i){ return '<span class="c' + (i === 5 ? ' ga' : '') + '">' + ch + '</span>'; }).join("");
    $("ex").classList.remove("on"); fig.querySelector(".tagI .h1").classList.remove("on");
    fig.querySelector(".tagI .x").style.opacity = 0;
  }

  // ===== 進め方（lock.js の FLOW）：文の拍＝図をぼかして中央に文／アニメの拍＝文が消え、ぼかしが解けて変化。ア/イ は FLOW がキー M で切り替え =====
  function mk(s, y){ var el = document.createElement("div"); el.className = "nt ctr"; el.dataset.s = s; el.dataset.x = 761; el.dataset.y = y; fig.appendChild(el); put(el); return el; }
  var CY = 391;   // 画面の中央（図の座標）
  // 文の拍。t2＝少し間をおいて下に足す2つ目の文、g＝マーカーの語を言った瞬間に光らせる物
  function TX(t, t2, g){
    var nl = t.split("／").length, e, e2;
    if (t2) { e = mk(t, CY - 20); e2 = mk(t2, CY - 20 + nl * 16 + 26); } else e = mk(t, CY);
    return {text: t2 ? [e, e2] : e, go: function(){
      var r = type(e, 300);
      if (g) glow(g(), r.hl);
      if (t2) type(e2, r.end + 700);
    }};
  }
  function AN(c, f){ return {cls: c, go: f}; }
  var x1 = function(){ return fig.querySelector(".tagI .x"); };
  var beats = [
    // 文は本文（docs\script_1-1_text.md 第6・7段落）どおり。／＝改行、〖〗＝マーカー
    TX("電流の向きが分かったところで、／次は〖大きさ〗です。"),
    TX("豆電球を〖もっと明るく〗するには、／どうしたらよいでしょう？", null, function(){ return [$("lamp")]; }),
    // 粒が少ない流れ → 多い流れへ。豆電球もそれにつれて明るく
    AN("", function(){ anim([[200, 500, .1], [1200, 2600, 1]]); glow([$("lamp")], 3700); }),
    TX("……流れる粒が〖多い〗ほど、／豆電球は明るくなります。", null, function(){ return [$("el"), $("ring")]; }),
    TX("このように、たくさん流れることを／「〖電流が大きい〗」といいます。"),
    // 線の外側に電流の矢印。粒が減って増えるのに合わせて、矢印も細く → 太く
    AN("arw", function(){ anim([[0, 400, .2], [700, 2200, 1]]); glow([$("arw")], 3000); }),
    TX("回路図や式では、電流を／〖I（アイ）〗という記号で書きます。"),
    // 矢印の下に名札「I」（その下に小さく「電流」）。名札がそっと光る
    AN("ti", function(){ T(function(){ x1().style.opacity = 1; fig.querySelector(".tagI .h1").classList.add("on"); }, 300); glow([x1()], 800); }),
    TX("I と出てきたら、／電流のことだと思ってください。"),
    TX("電流の大きさは、〖A（アンペア）〗／という単位で表します。"),
    // 名札が「I = 2 A」へ伸び、A がそっと光る
    AN("", function(){
      [].slice.call($("ex").children).forEach(function(c, i){ T(function(){ c.classList.add("in"); }, 300 + i * 90); });
      T(function(){ $("ex").classList.add("on"); }, 300 + 6 * 90 + 100);
      glow([fig.querySelector(".tagI .ga")], 1200);
    }),
    TX("たとえば I = 2 A は、／電流の大きさが2アンペアという意味です。"),
    // 名札「I = 2 A」と矢印がそっと光って止まる
    AN("", function(){ glow([x1(), fig.querySelector(".tagI .ga"), $("arw")], 300); })
  ];
  function reset(){ plan = []; D = .5; resetTag(); }
  resetTag();
  draw(); requestAnimationFrame(loop);
  FLOW.run({scr: $("scr"), beats: beats, reset: reset});
  function fit(){ var s = Math.min(innerWidth / 1180, innerHeight / 820); $("scr").style.transform = "scale(" + s + ")"; }
  fit(); addEventListener("resize", fit);
})();
</script>
</body>
</html>
