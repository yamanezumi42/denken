<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1-1 電流 段6</title>
<script src="lock.js"></script>
<style>
  html,body{margin:0;height:100%;background:#868e96}
  .scr{position:absolute;left:0;top:0;width:1180px;height:820px;background:#fff;transform-origin:0 0;overflow:hidden;cursor:pointer;
       font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
  .close{position:absolute;left:10px;top:4px;width:46px;height:42px;border:1px solid #bbb;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center}
  .band{position:absolute;left:68px;right:10px;top:6px;height:38px;border-radius:8px;background:#f2f2f2;display:flex;align-items:center;justify-content:center;
        font-size:17px;font-weight:700;color:#111}
  .fig{position:absolute;left:59px;top:90px;width:1062px;height:678px}
  .fig > svg{position:absolute;left:0;top:0}
  .dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:36px}
  .dots i{width:10px;height:10px;border-radius:50%;background:#ccc}
  .dots i.on{width:13px;height:13px;background:#d9480f;margin-top:-1.5px}
  svg text.pl{font-family:inherit;font-weight:800;font-size:17px;fill:#111;text-anchor:middle;dominant-baseline:middle}
  .k{stroke:#000;stroke-linecap:round;stroke-linejoin:round}
  /* 文：1文字ずつ下からふわっと・大事な語は黄色のマーカー／名札は絵の下で橙。文の時のぼかし（案1）と ア/イ は lock.js の FLOW が受け持つ */
  .nt{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;text-align:center;font-size:40px;font-weight:800;color:#111;line-height:1.3;
      opacity:0;transition:opacity .3s,text-shadow .4s;pointer-events:none}
  .nt.vis{opacity:1}
  .nt.ctr{font-size:44px}
  .nt.ctr.sum{font-size:30px;line-height:1.6}
  .nt.tag:not(.vis){opacity:0 !important}   /* 出す前の名札は、ぼかしの時も見せない */
  .nt .u{display:inline-block;white-space:pre}
  .nt .hl{font-weight:inherit;background:linear-gradient(transparent 55%,rgba(255,240,100,.75) 55%);background-size:0% 100%;background-repeat:no-repeat;transition:background-size .3s ease-out}
  .nt .hl.on{background-size:100% 100%}
  .tag .hl{background-image:linear-gradient(transparent 55%,rgba(255,146,43,.6) 55%)}
  /* 語や変化と同時に、絵がそっと光る */
  /* 電流そのものの流れ（段4・5と同じ案1＋矢じり）：光る小さな橙の矢印が＋極→－極へ流れる。前でも後でも同じ間隔・同じ速さ */
  .fl{filter:drop-shadow(0 0 2px #ffa94d) drop-shadow(0 0 5px #ffc078)}
  .fl .fs{fill:none;stroke:#ff922b;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
  .fl .fh{fill:#ff922b;stroke:#ff922b;stroke-width:1;stroke-linejoin:round}
  #ea,#eb,#ring{transition:filter .4s}
  #ea.gl,#eb.gl,#ring.gl{filter:drop-shadow(0 0 2.5px #4dabf7) drop-shadow(0 0 4px #a5d8ff)}
  .gl{text-shadow:0 0 10px #ffd43b,0 0 20px #ffe066}
</style>
</head>
<body>
<div class="scr" id="scr">
  <div class="close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"><path d="M5 5L19 19M19 5L5 19"/></svg></div>
  <div class="band">1-1　電流</div>
  <div class="fig" id="fig">
    <!-- 絵は画面の真ん中：図の中身 x470〜1052・y212〜512 の中心を枠の中心へ -->
    <svg viewBox="461 170 600 383" width="1062" height="678">
      <defs>
        <clipPath id="ca"><circle id="cca" cx="620" cy="360" r="0"/></clipPath>
        <clipPath id="cb"><circle id="ccb" cx="900" cy="360" r="0"/></clipPath>
      </defs>
      <path class="k" fill="none" stroke-width="3.2" d="M752 490 H478 V360 H736"/>
      <path class="k" fill="none" stroke-width="3.2" d="M784 360 H1045 V490 H772"/>
      <rect x="750.4" y="468" width="3.2" height="44" rx="1.6" fill="#000"/>
      <rect x="769.5" y="479" width="5" height="22" rx="2.5" fill="#000"/>
      <text class="pl" x="722" y="446">＋極</text><text class="pl" x="802" y="446">－極</text>
      <!-- 豆電球の記号（光っている・段5の最初と同じ明るさ） -->
      <circle cx="760" cy="360" r="35" fill="#ffe066" fill-opacity=".43"/>
      <g stroke="#fab005" stroke-width="4" stroke-linecap="round" opacity=".8">
        <path d="M787.7 371.5 L796 374.9 M771.5 387.7 L774.9 396 M748.5 387.7 L745.1 396 M732.3 371.5 L724 374.9 M732.3 348.5 L724 345.1 M748.5 332.3 L745.1 324 M771.5 332.3 L774.9 324 M787.7 348.5 L796 345.1"/>
      </g>
      <circle class="k" cx="760" cy="360" r="24" fill="#ffe78b" stroke-width="3.2"/>
      <path class="k" d="M743 343 L777 377 M777 343 L743 377" stroke-width="3.2"/>
      <g id="cur" class="fl"><path class="fs"/><path class="fh"/></g>
      <g id="ring"></g>
      <!-- 虫めがね2つ：豆電球の前（左）と後（右）。線の上の小さな輪から上へ広がる -->
      <g id="la" opacity="0">
        <path id="na" fill="#e7f5ff" fill-opacity=".7" stroke="#adb5bd" stroke-width="1.6"/>
        <circle cx="620" cy="360" r="13" fill="none" stroke="#495057" stroke-width="3"/>
        <circle id="ba" cx="620" cy="360" r="0" fill="#fff"/>
        <g clip-path="url(#ca)">
          <rect x="540" y="250" width="160" height="44" fill="#f8e3d2"/>
          <path d="M540 250 H700 M540 294 H700" stroke="#b5652a" stroke-width="2.4"/>
          <g id="ea"></g>
        </g>
        <circle id="ra" cx="620" cy="360" r="0" fill="none" stroke="#495057" stroke-width="5"/>
      </g>
      <g id="lb" opacity="0">
        <path id="nb" fill="#e7f5ff" fill-opacity=".7" stroke="#adb5bd" stroke-width="1.6"/>
        <circle cx="900" cy="360" r="13" fill="none" stroke="#495057" stroke-width="3"/>
        <circle id="bb" cx="900" cy="360" r="0" fill="#fff"/>
        <g clip-path="url(#cb)">
          <rect x="820" y="250" width="160" height="44" fill="#f8e3d2"/>
          <path d="M820 250 H980 M820 294 H980" stroke="#b5652a" stroke-width="2.4"/>
          <g id="eb"></g>
        </g>
        <circle id="rb" cx="900" cy="360" r="0" fill="none" stroke="#495057" stroke-width="5"/>
      </g>
    </svg>
    <!-- 名札（〖〗＝マーカー） -->
    <div class="nt tag pa" data-x="620" data-y="386">〖豆電球の前〗</div>
    <div class="nt tag pb" data-x="900" data-y="386">〖豆電球の後〗</div>
    <div class="nt tag aa" data-x="620" data-y="424">〖2 A〗</div>
    <div class="nt tag ab" data-x="900" data-y="424">〖2 A〗</div>
  </div>
  <div class="dots"><i></i><i></i><i></i><i></i><i></i><i></i><i class="on"></i></div>
</div>
<script>
(function(){
  var NS = "http://www.w3.org/2000/svg", $ = function(id){ return document.getElementById(id); };
  function L(a, b, u){ return a + (b - a) * u; }
  function ease(u){ return u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; }
  function T(f, d){ return setTimeout(f, d); }
  function dot(g, r){ var c = document.createElementNS(NS, "circle"); c.setAttribute("r", r); c.setAttribute("fill", "#339af0"); c.setAttribute("stroke", "#1864ab"); c.setAttribute("stroke-width", .9); g.appendChild(c); return c; }
  // 虫めがねの中の電子：前と後でまったく同じ並び・同じ数・同じ速さ（左向き＝電子は上の線を右から左へ）
  var W = 168, LA = [], LB = [];
  [[LA, $("ea"), 536], [LB, $("eb"), 816]].forEach(function(o){
    [259, 268, 277, 286].forEach(function(y, r){
      for (var x = (r % 2) * 5; x < W; x += 10) o[0].push({x: x + ((x * 7 + r * 13) % 5 - 2) * .5, y: y + ((x * 3 + r) % 3 - 1) * .7, x0: o[2], c: dot(o[1], 3.1)});
    });
  });
  function along(seg, s){
    for (var i = 0; i < seg.length; i++) { var q = seg[i], l = Math.abs(q[2] - q[0]) + Math.abs(q[3] - q[1]);
      if (s <= l) { var t = s / l; return [L(q[0], q[2], t), L(q[1], q[3], t)]; } s -= l; }
    return [seg[seg.length - 1][2], seg[seg.length - 1][3]];
  }
  // 輪全体の電子：－極から出て右の線→上の線（右から左）→左の線→＋極へ
  var SG = [[772, 490, 1045, 490], [1045, 490, 1045, 360], [1045, 360, 478, 360], [478, 360, 478, 490], [478, 490, 752, 490]], RL = 0, RD = [];
  SG.forEach(function(q){ RL += Math.abs(q[2] - q[0]) + Math.abs(q[3] - q[1]); });
  for (var s = 0; s < RL; s += 20) RD.push({s: s, c: dot($("ring"), 3.4)});
  var off = 0, last = 0;
  function draw(){
    LA.concat(LB).forEach(function(d){ var x = d.x0 + ((((d.x - off * 1.3) % W) + W) % W); d.c.setAttribute("cx", x); d.c.setAttribute("cy", d.y); });
    RD.forEach(function(d){ var p = along(SG, ((d.s + off) % RL + RL) % RL), hide = (p[1] === 360 && p[0] > 731 && p[0] < 789);
      d.c.setAttribute("cx", p[0]); d.c.setAttribute("cy", p[1]); d.c.setAttribute("opacity", hide ? 0 : 1); });
    flow($("cur"), off);
  }
  // ===== 電流そのものの流れ：光る小さな橙の矢印（筋＋矢じり）が、線に沿って＋極→－極へ次々に流れる（段4・5と同じ形） =====
  var CG = [[752, 490, 478, 490], [478, 490, 478, 360], [478, 360, 1045, 360], [1045, 360, 1045, 490], [1045, 490, 772, 490]], CT = 0;
  CG.forEach(function(q){ CT += Math.abs(q[2] - q[0]) + Math.abs(q[3] - q[1]); });
  function hideL(p){ return p[1] === 360 && p[0] > 729 && p[0] < 791; }   // 豆電球の記号の中は描かない
  function flow(g, sh){
    var sd = "", hd = "", f = function(q){ return q[0].toFixed(1) + " " + q[1].toFixed(1); };
    for (var h = 0; h < CT; h += 40) {
      var s = ((h + sh) % CT + CT) % CT, tail = s - 15, neck = s - 6;
      if (tail < 0) continue;   // 乾電池のすき間（－極→＋極）はまたがない
      var p = along(CG, s), pts = [];
      for (var b = tail; b < neck; b += 3) pts.push(along(CG, b));
      pts.push(along(CG, neck));
      if (hideL(p) || pts.some(hideL)) continue;
      var q = along(CG, s - 1), tx = p[0] - q[0], ty = p[1] - q[1], tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      var nx = p[0] - tx * 7, ny = p[1] - ty * 7, w = 4.6;
      sd += "M" + pts.map(f).join(" L");
      hd += "M" + f(p) + " L" + f([nx - ty * w, ny + tx * w]) + " L" + f([nx + ty * w, ny - tx * w]) + " Z";
    }
    g.querySelector(".fs").setAttribute("d", sd); g.querySelector(".fh").setAttribute("d", hd);
  }
  function loop(now){ if (last) off += (now - last) / 1000 * 34; last = now; draw(); requestAnimationFrame(loop); }
  loop.free = true;   // 粒がずっと流れる動きは、クリックの受付を止めない
  // 虫めがね2つが線の上の小さな輪から上へ広がる（0〜1）
  function lens(u0){
    var u = ease(u0), cy = L(360, 276, u), r = L(13, 64, u);
    [["a", 620], ["b", 900]].forEach(function(o){ var k = o[0], x = o[1];
      $("l" + k).setAttribute("opacity", Math.min(1, u0 * 4));
      ["b" + k, "r" + k, "cc" + k].forEach(function(id){ $(id).setAttribute("cy", cy); $(id).setAttribute("r", r); });
      $("n" + k).setAttribute("d", "M" + (x - 13) + " 360 L" + (x - r) + " " + cy + " L" + (x + r) + " " + cy + " L" + (x + 13) + " 360 Z");
    });
  }
  function grow(d0, ms){ T(function(){ var t0 = performance.now();
    (function step(now){ var u = Math.min(1, (now - t0) / ms); lens(u); if (u < 1) requestAnimationFrame(step); })(t0); }, d0); }
  // 文と名札
  var VB = [461, 170], K = 1062 / 600, fig = $("fig");
  function html(s){ return s.replace(/〖([^〗]*)〗/g, '<b class="hl">$1</b>').replace(/／/g, "<br>"); }
  function put(el){ el.style.left = ((+el.dataset.x - VB[0]) * K) + "px"; el.style.top = ((+el.dataset.y - VB[1]) * K) + "px"; }
  function type(el, d0){
    d0 = 200 + (d0 || 0); el.innerHTML = html(el.dataset.s);
    var us = [];
    (function walk(nd){ [].slice.call(nd.childNodes).forEach(function(c){
      if (c.nodeType === 3) { var f = document.createDocumentFragment();
        Array.from(c.textContent).forEach(function(ch){ var u = document.createElement("span"); u.className = "u"; u.textContent = ch; u.style.opacity = 0; f.appendChild(u); us.push(u); });
        c.parentNode.replaceChild(f, c); } else walk(c); }); })(el);
    var dt = Math.min(60, 800 / us.length);
    us.forEach(function(u, i){ u.style.transform = "translateY(18px)";
      T(function(){ u.style.transition = "opacity .3s, transform .3s ease-out"; u.style.opacity = 1; u.style.transform = "none"; }, d0 + i * dt); });
    var hs = el.querySelectorAll(".hl"), k = 0, end = d0 + us.length * dt + 300, tw = end - 200;
    if (hs.length) { var pre = 0; (function walk(nd){ [].slice.call(nd.childNodes).forEach(function(c){ if (k) return; if (c.classList && c.classList.contains("hl")) { k = 1; tw = d0 + (pre + c.textContent.length) * dt + 150; } else if (c.classList && c.classList.contains("u")) pre++; else walk(c); }); })(el); }
    hs.forEach(function(h){ T(function(){ h.classList.add("on"); }, tw); });
    return {hl: tw, end: Math.max(end, tw + 300)};
  }
  function tag(el, d){ T(function(){ el.classList.add("vis"); }, d); return type(el, d); }
  function glow(els, t){ T(function(){ els.forEach(function(g){ g.classList.add("gl"); T(function(){ g.classList.remove("gl"); }, 1300); }); }, t); }
  var q = function(c){ return fig.querySelector("." + c); };
  fig.querySelectorAll(".nt").forEach(function(el){ el.dataset.s = el.textContent.trim(); put(el); });

  // ===== 進め方（lock.js の FLOW）：文の拍＝図をぼかして中央に文／アニメの拍＝文が消え、ぼかしが解けて変化。ア/イ は FLOW がキー M で切り替え =====
  function mk(s, y, c){ var el = document.createElement("div"); el.className = "nt ctr" + (c ? " " + c : ""); el.dataset.s = s; el.dataset.x = 761; el.dataset.y = y; fig.appendChild(el); put(el); return el; }
  var CY = 361;   // 画面の中央（図の座標）
  function TX(t, t2, g, c){
    var nl = t.split("／").length, e, e2;
    if (t2) { e = mk(t, CY - 20); e2 = mk(t2, CY - 20 + nl * 16 + 26); } else e = mk(t, CY, c);
    return {text: t2 ? [e, e2] : e, go: function(){
      var r = type(e, 300);
      if (g) glow(g(), r.hl);
      if (t2) type(e2, r.end + 700);
    }};
  }
  function AN(c, f){ return {cls: c, go: f}; }
  // 文は本文（docs\script_1-1_text.md 第8段落・まとめ）どおり。／＝改行、〖〗＝マーカー
  var beats = [
    TX("最後に、豆電球を通った後、／電流は〖減る〗のでしょうか？"),
    // 豆電球の前と後の2か所に虫めがね。どちらも同じ数の粒が、同じ速さで流れている
    AN("", function(){ grow(200, 900); tag(q("pa"), 1100); tag(q("pb"), 1300); glow([$("ea"), $("eb")], 2000); }),
    TX("……豆電球の前と後で、／流れる粒の数を比べると、／どちらも〖同じ〗です。", null, function(){ return [$("ea"), $("eb")]; }),
    TX("電子の粒は、豆電球の中で使われて／〖なくなるわけではありません〗。", null, function(){ return [$("ring")]; }),
    TX("ですから、分かれ道のない1本の道なら、／どこで測っても電流は〖同じ大きさ〗です。"),
    // 2か所に同じ「2 A」の名札
    AN("", function(){ tag(q("aa"), 300); tag(q("ab"), 300); glow([q("aa"), q("ab")], 900); }),
    // まとめ（3行）
    TX("まとめると、電流は〖電子の流れ〗で、記号は I、単位は A です。／向きは＋極から出て－極へと決められていて、電子の動く向きとは逆です。／そして、1本の道なら、どこで測っても電流の大きさは同じです。", null, null, "sum")
  ];
  function reset(){ lens(0); ["la", "lb"].forEach(function(id){ $(id).setAttribute("opacity", 0); }); ["pa", "pb", "aa", "ab"].forEach(function(c){ q(c).classList.remove("vis"); }); }
  reset();
  draw(); requestAnimationFrame(loop);
  FLOW.run({scr: $("scr"), beats: beats, reset: reset});
  function fit(){ var s = Math.min(innerWidth / 1180, innerHeight / 820); $("scr").style.transform = "scale(" + s + ")"; }
  fit(); addEventListener("resize", fit);
})();
</script>
</body>
</html>
